# Promotes a release once its docs are public. When a release-vX.Y.Z PR merges into main (GitBook
# renders main), it clears the release's Pre-release label and marks it Latest, unless a newer release
# already is. Run it by hand with a tag to promote a release whose own PR was closed because a later
# release PR published its changes, or whose branch update brought in a fix from main. Update a release
# PR's branch only with a merge, not a rebase.
name: Promote release
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to promote (vX.Y.Z); its tag must be on main"
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  promote:
    name: Promote release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release-v'))
    # On the job, not the workflow, so the runs of every other PR closed into main don't queue in the group.
    # queue: max keeps every pending promotion: by default a new one cancels the one already waiting
    concurrency:
      group: ${{ github.workflow }}
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check that the release is on main
        id: release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=${INPUT_TAG:-${HEAD_REF#release-}}
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a vX.Y.Z release tag"
            exit 1
          fi
          tagged=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
          # Update branch merges main in: a new head commit with the tag's files, so compare files, not commits
          if [ -n "$HEAD_SHA" ] && [ "$HEAD_SHA" != "$tagged" ]; then
            tagged_tree=$(gh api "repos/$GH_REPO/commits/$tagged" --jq .commit.tree.sha)
            head_tree=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" --jq .commit.tree.sha)
            if [ "$head_tree" != "$tagged_tree" ]; then
              echo "::error::release-$tag merged at $HEAD_SHA, but its files differ from $tag ($tagged): $(gh api "repos/$GH_REPO/compare/$tagged...$HEAD_SHA" --jq '[.files[].filename] | join(", ")'). If those files came from main (a fix merged into main while the release PR was open), $tag is published: run Promote release by hand with $tag. Otherwise main got changes outside $tag"
              exit 1
            fi
          fi
          main=$(gh api "repos/$GH_REPO/compare/$tagged...main" --jq .status)
          if [ "$main" != ahead ] && [ "$main" != identical ]; then
            echo "::error::$tag ($tagged) is not on main ($main). If its release PR merged without a merge commit or its branch was updated with a rebase, open a PR into main from a new branch at $tagged, merge it with a merge commit, then run Promote release by hand with $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Clear the Pre-release label and mark Latest
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Latest is the highest published version: promoting an older release must not take it back
          published=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')
          newest=$(printf '%s\n%s\n' "$published" "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then latest=true; else latest=false; fi
          if ! gh release edit "$TAG" --prerelease=false --latest="$latest"; then
            echo "::error::github.token cannot edit a release on a commit whose workflow files differ from the default branch. If that is why, edit $TAG on the Releases page: clear Set as a pre-release, and set Set as the latest release: $latest"
            exit 1
          fi
          echo "Promoted $TAG, Latest: $latest"
