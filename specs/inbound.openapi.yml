openapi: 3.1.0
info:
  title: Inbound
  version: 2.0.0
  description: |
    Receive and inspect inbound email in Mailtrap. Inboxes are organized into
    folders and accept messages at their generated inbound address. Use the
    Messages endpoints to list, fetch, and delete received mail, and pair them
    with an `inbound_receiving` webhook to be notified the moment a new
    message arrives.

    For a complete guide, see [Inbound](https://docs.mailtrap.io/getting-started/inbound-email).
  contact:
    name: Mailtrap Support
    url: "https://docs.mailtrap.io"
    email: support@mailtrap.io
  license:
    name: Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)
    url: "https://creativecommons.org/licenses/by-sa/4.0/"
  x-logo:
    url: "https://mailtrap.io/wp-content/uploads/2021/04/mailtrap-logo.svg"

servers:
  - description: Mailtrap API
    url: "https://mailtrap.io"

security:
  - HeaderAuth: []
  - BearerAuth: []

tags:
  - name: folders
    x-page-title: Folders
    x-page-description: Organize inbound inboxes
    description: |
      Folders group inbound inboxes within an account. Every inbox belongs to
      exactly one folder.

  - name: inboxes
    x-page-title: Inboxes
    x-page-description: Receive inbound email
    description: |
      An inbox is the destination for inbound email. Each inbox is created
      inside a folder and gets a unique generated address that can receive
      mail from any sender.

  - name: messages
    x-page-title: Messages
    x-page-description: List, inspect, and respond to received messages
    description: |
      Inbound messages are the emails delivered to an inbox. Use these
      endpoints to page through recent messages, fetch the full body and
      attachments, reply to or forward a message, or delete one you no longer
      need.

  - name: threads
    x-page-title: Threads
    x-page-description: Group related messages into conversations
    description: |
      A thread groups the inbound and outbound messages that belong to the
      same conversation. Use these endpoints to page through an inbox's
      threads, fetch a single thread with its messages embedded, or delete a
      thread.

paths:
  /api/inbound/folders:
    get:
      operationId: listInboundFolders
      summary: List folders
      description: Returns all inbound folders in the account.
      tags:
        - folders
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET https://mailtrap.io/api/inbound/folders \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "200":
          description: List of folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
              example:
                - id: 1
                  name: Support
                - id: 2
                  name: Sales
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createInboundFolder
      summary: Create a folder
      description: Create a new inbound folder.
      tags:
        - folders
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X POST https://mailtrap.io/api/inbound/folders \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{ "name": "Support" }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
              example:
                id: 1
                name: Support
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/inbound/folders/{folder_id}:
    get:
      operationId: getInboundFolder
      summary: Get a folder
      description: Returns a single inbound folder.
      tags:
        - folders
      parameters:
        - $ref: "#/components/parameters/folder_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET https://mailtrap.io/api/inbound/folders/{folder_id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "200":
          description: Folder details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateInboundFolder
      summary: Update a folder
      description: Update an inbound folder.
      tags:
        - folders
      parameters:
        - $ref: "#/components/parameters/folder_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X PATCH https://mailtrap.io/api/inbound/folders/{folder_id} \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{ "name": "Customer Success" }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "200":
          description: Folder updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: deleteInboundFolder
      summary: Delete a folder
      description: |
        Permanently delete an inbound folder along with all of its inboxes.
      tags:
        - folders
      parameters:
        - $ref: "#/components/parameters/folder_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X DELETE https://mailtrap.io/api/inbound/folders/{folder_id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "204":
          description: Folder deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/inbound/folders/{folder_id}/inboxes:
    get:
      operationId: listInboundInboxes
      summary: List inboxes
      description: Returns all inboxes in a folder.
      tags:
        - inboxes
      parameters:
        - $ref: "#/components/parameters/folder_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET https://mailtrap.io/api/inbound/folders/{folder_id}/inboxes \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "200":
          description: List of inboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inbox"
              example:
                - id: 1
                  name: Support tickets
                  address: "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                - id: 2
                  name: Replies
                  address: "replies-5e6f7a8b@inbound-mailtrap.io"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createInboundInbox
      summary: Create an inbox
      description: |
        Create a new inbox in a folder. Mailtrap generates the inbox `address`
        automatically based on the `name`.
      tags:
        - inboxes
      parameters:
        - $ref: "#/components/parameters/folder_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X POST https://mailtrap.io/api/inbound/folders/{folder_id}/inboxes \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{ "name": "Support tickets" }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxInput"
      responses:
        "201":
          description: Inbox created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
              example:
                id: 1
                name: Support tickets
                address: "support-tickets-1a2b3c4d@inbound-mailtrap.io"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/inbound/folders/{folder_id}/inboxes/{inbox_id}:
    get:
      operationId: getInboundInbox
      summary: Get an inbox
      description: Returns a single inbox.
      tags:
        - inboxes
      parameters:
        - $ref: "#/components/parameters/folder_id"
        - $ref: "#/components/parameters/inbox_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET https://mailtrap.io/api/inbound/folders/{folder_id}/inboxes/{inbox_id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "200":
          description: Inbox details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateInboundInbox
      summary: Update an inbox
      description: |
        Rename an inbox. The generated `address` does not change.
      tags:
        - inboxes
      parameters:
        - $ref: "#/components/parameters/folder_id"
        - $ref: "#/components/parameters/inbox_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X PATCH https://mailtrap.io/api/inbound/folders/{folder_id}/inboxes/{inbox_id} \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{ "name": "Support tickets v2" }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxInput"
      responses:
        "200":
          description: Inbox updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: deleteInboundInbox
      summary: Delete an inbox
      description: |
        Permanently delete an inbox and all its received messages.
      tags:
        - inboxes
      parameters:
        - $ref: "#/components/parameters/folder_id"
        - $ref: "#/components/parameters/inbox_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X DELETE https://mailtrap.io/api/inbound/folders/{folder_id}/inboxes/{inbox_id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "204":
          description: Inbox deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/inbound/inboxes/{inbox_id}/messages:
    get:
      operationId: listInboundMessages
      summary: List messages
      description: |
        Returns inbound messages received by the inbox, ordered by
        `received_at` descending.

        List responses use cursor pagination. When more results are available
        the response includes a `last_id`; pass it back as the `last_id` query
        parameter to get the next page. When `last_id` is `null` you have
        reached the end.
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - name: last_id
          in: query
          required: false
          description: |
            ID of the last message from the previous page. Pass the `last_id`
            value returned by the previous response to fetch the next page.
            Omit on the first request.
          schema:
            type: string
            example: "1700000000000123"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET 'https://mailtrap.io/api/inbound/inboxes/{inbox_id}/messages' \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesListResponse"
              example:
                data:
                  - id: "1700000000000123"
                    inbox_id: 1
                    from: "sender@example.com"
                    to:
                      - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                    cc: []
                    bcc: []
                    reply_to: null
                    subject: Hello
                    message_id: "<abc@sender.example>"
                    in_reply_to: null
                    references: []
                    headers:
                      mime-version: "1.0"
                    size: 4096
                    html_size: 512
                    text_size: 128
                    received_at: "2026-05-08T10:30:00.000Z"
                    attachments:
                      - attachment_id: att-1
                        size: 1024
                        filename: logo.png
                        content_type: image/png
                        content_disposition: inline
                        content_id: "logo@example.com"
                total_count: 1
                last_id: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/inbound/inboxes/{inbox_id}/messages/{id}:
    get:
      operationId: getInboundMessage
      summary: Get a message
      description: |
        Returns a single inbound message together with URLs for the
        raw `.eml` file and for each attachment, plus the decoded HTML and
        plain-text bodies. URLs expire after one hour.
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - $ref: "#/components/parameters/message_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET https://mailtrap.io/api/inbound/inboxes/{inbox_id}/messages/{id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "200":
          description: Message details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteInboundMessage
      summary: Delete a message
      description: |
        Permanently delete an inbound message and its stored body and
        attachments.
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - $ref: "#/components/parameters/message_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X DELETE https://mailtrap.io/api/inbound/inboxes/{inbox_id}/messages/{id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "204":
          description: Message deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/inbound/inboxes/{inbox_id}/messages/{id}/reply:
    post:
      operationId: replyToInboundMessage
      summary: Reply to a message
      description: |
        Send a reply to an inbound message. The reply is threaded to the
        original: the subject is prefixed with `Re:` (unless it already starts
        with one) and the `In-Reply-To` and `References` headers are set
        automatically, so they cannot be overridden.

        By default the reply is addressed to the original sender (its
        `Reply-To`, or `From` when absent). Pass `to` to override the
        recipients — an explicit empty array sends to `cc`/`bcc` only — or add
        `cc`/`bcc`.

        The sender depends on the inbox type:

        - **Mailtrap-hosted inbox** — always sends from the inbox's own
          generated address. Supplying `from` is rejected with `400`.
        - **Custom-domain inbox** — you supply `from`, whose address must
          belong to the inbox's domain.
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - $ref: "#/components/parameters/message_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
            example:
              text: "Thanks for reaching out. We are looking into it."
              html: "<p>Thanks for reaching out. We are looking into it.</p>"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X POST https://mailtrap.io/api/inbound/inboxes/{inbox_id}/messages/{id}/reply \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{ "text": "Thanks for reaching out. We are looking into it." }'
      responses:
        "201":
          $ref: "#/components/responses/SendMessageAccepted"
        "400":
          $ref: "#/components/responses/SendMessageBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SendMessageForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/inbound/inboxes/{inbox_id}/messages/{id}/reply_all:
    post:
      operationId: replyAllToInboundMessage
      summary: Reply all to a message
      description: |
        Send a reply to an inbound message and copy the original's other
        recipients. Behaves exactly like [Reply to a message](#operation/replyToInboundMessage),
        except `cc` defaults to the original's `To` + `Cc` — minus the inbox's
        own addresses and the sender (already in `To`).

        Pass `to`, `cc`, or `bcc` to override the computed recipients. As with a
        plain reply, the subject is prefixed with `Re:` and the threading
        headers are set automatically.
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - $ref: "#/components/parameters/message_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
            example:
              text: "Thanks all. Adding my colleague to the thread."
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X POST https://mailtrap.io/api/inbound/inboxes/{inbox_id}/messages/{id}/reply_all \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{ "text": "Thanks all. Adding my colleague to the thread." }'
      responses:
        "201":
          $ref: "#/components/responses/SendMessageAccepted"
        "400":
          $ref: "#/components/responses/SendMessageBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SendMessageForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/inbound/inboxes/{inbox_id}/messages/{id}/forward:
    post:
      operationId: forwardInboundMessage
      summary: Forward a message
      description: |
        Forward an inbound message to new recipients. The subject is prefixed
        with `Fwd:` (unless it already starts with one). The original message is
        always carried along: its rendered body is quoted below your optional
        note and its attachments are re-attached (any attachments you supply are
        added on top).

        A forward has no implicit recipient — you must address it with `to`
        (and optionally `cc`/`bcc`). The `from` rules match [Reply](#operation/replyToInboundMessage):
        rejected for Mailtrap-hosted inboxes, required-and-domain-bound for
        custom-domain inboxes.
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - $ref: "#/components/parameters/message_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
            example:
              to:
                - email: "colleague@example.com"
                  name: "A. Colleague"
              text: "Please take a look at the message below."
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X POST https://mailtrap.io/api/inbound/inboxes/{inbox_id}/messages/{id}/forward \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{ "to": [{ "email": "colleague@example.com" }], "text": "Please take a look at the message below." }'
      responses:
        "201":
          $ref: "#/components/responses/SendMessageAccepted"
        "400":
          $ref: "#/components/responses/SendMessageBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SendMessageForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/inbound/inboxes/{inbox_id}/threads:
    get:
      operationId: listInboundThreads
      summary: List threads
      description: |
        Returns the inbox's conversation threads, ordered by most recent
        activity first.

        Only threads and messages within your plan's retention window are
        included; the per-thread aggregates (message count, size, senders,
        recipients, attachments) are computed over those accessible messages.

        Results use cursor pagination. Pass the `next_token` from the previous
        response's `pagination` block as the `token` query parameter to fetch
        the next page; when `next_token` is `null` you have reached the end.
        Use `per_page` to control the page size.
      tags:
        - threads
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - name: token
          in: query
          required: false
          description: |
            Pagination cursor from the previous response's
            `pagination.next_token`. Omit on the first request.
          schema:
            type: string
            example: "eyJsYXN0X2FjdGl2aXR5X2F0IjoxNzQ2NzAwMjAwMDAwLCJpZCI6IjE3MDAwMDAwMDAwMDAxMjMifQ"
        - name: per_page
          in: query
          required: false
          description: Number of threads per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET 'https://mailtrap.io/api/inbound/inboxes/{inbox_id}/threads' \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "200":
          description: List of threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadsListResponse"
              example:
                data:
                  - id: "1700000000000123"
                    subject: "Support request"
                    message_count: 3
                    size: 24576
                    first_message_at: "2026-05-08T10:30:00.000Z"
                    last_received_at: "2026-05-08T12:05:00.000Z"
                    last_sent_at: "2026-05-08T11:40:00.000Z"
                    last_activity_at: "2026-05-08T12:05:00.000Z"
                    last_message_id: "1700000000000789"
                    senders:
                      - "customer@example.com"
                      - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                    recipients:
                      - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                      - "customer@example.com"
                    attachments:
                      - attachment_id: att-1
                        filename: invoice.pdf
                        size: 20480
                        content_type: application/pdf
                        content_disposition: attachment
                        content_id: null
                        download_url: "https://s3.amazonaws.com/inbound-mail/att-1?X-Amz-Signature=..."
                        download_url_expires_at: "2026-05-08T13:05:00.000Z"
                pagination:
                  token: null
                  next_token: null
                  current_url: "https://mailtrap.io/api/inbound/inboxes/1/threads"
                  next_url: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/inbound/inboxes/{inbox_id}/threads/{id}:
    get:
      operationId: getInboundThread
      summary: Get a thread
      description: |
        Returns a single thread with its messages embedded, ordered oldest
        first.

        Each message carries a `visibility_status`:

        - `available` — the message is within your plan's retention window. The
          full envelope, subject, RFC headers, decoded bodies, and attachment
          download URLs are included; outbound messages also carry their
          delivery lifecycle (`delivery_status`, `delivered_at`, `bounced_at`).
        - `placeholder` — the message is outside the retention window. Only
          `visibility_status` and `direction` are returned; every other field is
          omitted and no attachment download URLs are issued.
      tags:
        - threads
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - $ref: "#/components/parameters/thread_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET https://mailtrap.io/api/inbound/inboxes/{inbox_id}/threads/{id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "200":
          description: Thread details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadResponse"
              example:
                data:
                  id: "1700000000000123"
                  subject: "Support request"
                  message_count: 3
                  size: 24576
                  first_message_at: "2026-05-08T10:30:00.000Z"
                  last_received_at: "2026-05-08T12:05:00.000Z"
                  last_sent_at: "2026-05-08T11:40:00.000Z"
                  last_activity_at: "2026-05-08T12:05:00.000Z"
                  last_message_id: "1700000000000789"
                  senders:
                    - "customer@example.com"
                    - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                  recipients:
                    - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                    - "customer@example.com"
                  attachments:
                    - attachment_id: att-1
                      filename: invoice.pdf
                      size: 20480
                      content_type: application/pdf
                      content_disposition: attachment
                      content_id: null
                      download_url: "https://s3.amazonaws.com/inbound-mail/att-1?X-Amz-Signature=..."
                      download_url_expires_at: "2026-05-08T13:05:00.000Z"
                  messages:
                    - visibility_status: available
                      direction: inbound
                      id: "1700000000000123"
                      subject: "Support request"
                      message_id: "<abc@customer.example>"
                      in_reply_to: null
                      references: []
                      from: "customer@example.com"
                      to:
                        - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                      cc: []
                      bcc: []
                      reply_to: null
                      created_at: "2026-05-08T10:30:00.000Z"
                      email_size: 8192
                      text_body: "I need help with my order."
                      html_body: "<p>I need help with my order.</p>"
                      attachments: []
                    - visibility_status: available
                      direction: outbound
                      id: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                      subject: "Re: Support request"
                      message_id: "<def@send.example>"
                      in_reply_to: "<abc@customer.example>"
                      references:
                        - "<abc@customer.example>"
                      from: "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                      to:
                        - "customer@example.com"
                      cc: []
                      bcc: []
                      reply_to: null
                      created_at: "2026-05-08T11:40:00.000Z"
                      email_size: 8192
                      text_body: "Happy to help — could you share your order ID?"
                      html_body: "<p>Happy to help — could you share your order ID?</p>"
                      attachments: []
                      delivery_status: delivered
                      delivered_at: "2026-05-08T11:40:05.000Z"
                      bounced_at: null
                    - visibility_status: placeholder
                      direction: inbound
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteInboundThread
      summary: Delete a thread
      description: |
        Delete a thread. Inbound messages in the thread are removed; outbound
        (sent) messages are preserved.
      tags:
        - threads
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - $ref: "#/components/parameters/thread_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X DELETE https://mailtrap.io/api/inbound/inboxes/{inbox_id}/threads/{id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
      responses:
        "204":
          description: Thread deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    HeaderAuth:
      type: apiKey
      description: API token in Api-Token header
      in: header
      name: Api-Token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication

  parameters:
    folder_id:
      name: folder_id
      in: path
      required: true
      description: Inbound folder ID
      schema:
        type: integer
        example: 1

    inbox_id:
      name: inbox_id
      in: path
      required: true
      description: Inbound inbox ID
      schema:
        type: integer
        example: 1

    message_id:
      name: id
      in: path
      required: true
      description: Inbound message ID
      schema:
        type: string
        example: "1700000000000123"

    thread_id:
      name: id
      in: path
      required: true
      description: Inbound thread ID
      schema:
        type: string
        example: "1700000000000123"

  schemas:
    Folder:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Support

    FolderInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Support

    Inbox:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Support tickets
        address:
          type: string
          format: email
          description: |
            Generated inbound address. Mail sent to this address is delivered
            to the inbox.
          example: "support-tickets-1a2b3c4d@inbound-mailtrap.io"

    InboxInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Support tickets

    Attachment:
      type: object
      properties:
        attachment_id:
          type: string
          example: att-1
        size:
          type:
            - integer
            - "null"
          example: 1024
        filename:
          type:
            - string
            - "null"
          example: logo.png
        content_type:
          type:
            - string
            - "null"
          example: image/png
        content_disposition:
          type:
            - string
            - "null"
          enum:
            - attachment
            - inline
            - null
          example: inline
        content_id:
          type:
            - string
            - "null"
          description: |
            `Content-ID` header value, used to reference inline attachments
            from the HTML body.
          example: "logo@example.com"

    AttachmentWithDownloadUrl:
      allOf:
        - $ref: "#/components/schemas/Attachment"
        - type: object
          properties:
            download_url:
              type:
                - string
                - "null"
              format: uri
              description: URL to download the attachment. Expires after one hour.
              example: "https://s3.amazonaws.com/inbound-mail/att-1?X-Amz-Signature=..."
            download_url_expires_at:
              type:
                - string
                - "null"
              format: date-time
              example: "2026-05-08T11:30:00.000Z"

    Message:
      type: object
      properties:
        id:
          type: string
          description: Mailtrap object ID for the message (not the `Message-ID` header value).
          example: "1700000000000123"
        inbox_id:
          type: integer
          example: 1
        from:
          type:
            - string
            - "null"
          example: "sender@example.com"
        to:
          type: array
          items:
            type: string
          example:
            - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
        cc:
          type: array
          items:
            type: string
          example: []
        bcc:
          type: array
          items:
            type: string
          example: []
        reply_to:
          type:
            - string
            - "null"
          example: null
        subject:
          type:
            - string
            - "null"
          example: Hello
        message_id:
          type:
            - string
            - "null"
          description: Value of the original `Message-ID` header.
          example: "<abc@sender.example>"
        in_reply_to:
          type:
            - string
            - "null"
          example: null
        references:
          type: array
          items:
            type: string
          example: []
        headers:
          type:
            - object
            - "null"
          additionalProperties:
            type: string
          description: |
            Selected headers from the original message, lowercased.
          example:
            mime-version: "1.0"
            return-path: "<sender@example.com>"
        size:
          type:
            - integer
            - "null"
          description: Total size of the raw message in bytes.
          example: 4096
        html_size:
          type:
            - integer
            - "null"
          description: Size of the HTML body in bytes. Zero if the message has no HTML part.
          example: 512
        text_size:
          type:
            - integer
            - "null"
          description: Size of the plain-text body in bytes. Zero if the message has no text part.
          example: 128
        received_at:
          type: string
          format: date-time
          example: "2026-05-08T10:30:00.000Z"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    MessageDetails:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          properties:
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/AttachmentWithDownloadUrl"
            raw_message_url:
              type:
                - string
                - "null"
              format: uri
              description: |
                URL to download the raw `.eml` file. Expires after one hour.
              example: "https://s3.amazonaws.com/inbound-mail/raw.eml?X-Amz-Signature=..."
            raw_message_expires_at:
              type:
                - string
                - "null"
              format: date-time
              example: "2026-05-08T11:30:00.000Z"
            html_body:
              type:
                - string
                - "null"
              description: Decoded HTML body. `null` when the message has no HTML part.
              example: "<html><body>Hello</body></html>"
            text_body:
              type:
                - string
                - "null"
              description: Decoded plain-text body. `null` when the message has no text part.
              example: "Hello"

    MessagesListResponse:
      type: object
      required:
        - data
        - total_count
        - last_id
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        total_count:
          type: integer
          description: Total number of messages within the retention window.
          example: 1
        last_id:
          type:
            - string
            - "null"
          description: |
            Cursor for the next page. `null` when there are no more results.
          example: null

    Address:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "recipient@example.com"
        name:
          type: string
          example: "Jane Doe"

    EmailAttachment:
      type: object
      required:
        - content
        - filename
      properties:
        content:
          type: string
          description: Base64-encoded attachment content.
          example: "PGh0bWw+PGJvZHk+SGVsbG88L2JvZHk+PC9odG1sPg=="
        filename:
          type: string
          example: "invoice.pdf"
        type:
          type: string
          description: MIME type of the attachment.
          example: "application/pdf"
        disposition:
          type: string
          enum:
            - attachment
            - inline
          default: attachment
          example: attachment
        content_id:
          type: string
          description: |
            `Content-ID` used to reference an inline attachment from the HTML
            body. Only relevant when `disposition` is `inline`.
          example: "invoice@example.com"

    SendMessageInput:
      type: object
      description: |
        Options for the outbound message. All fields are optional. `reply` and
        `reply_all` must carry a body (`text` and/or `html`); `forward` may omit
        it, since the original message is quoted automatically. `forward` also
        requires at least one recipient in `to`. Addresses use the Email
        Sending API `{ email, name }` shape.
      properties:
        from:
          allOf:
            - $ref: "#/components/schemas/Address"
          description: |
            Sender address. Rejected for Mailtrap-hosted inboxes (they always
            send from their own address); required for custom-domain inboxes,
            where the address must belong to the inbox's domain.
        to:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Address"
        cc:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Address"
        bcc:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Address"
        reply_to:
          $ref: "#/components/schemas/Address"
        text:
          type: string
          description: Plain-text body.
          example: "Thanks for reaching out. We are looking into it."
        html:
          type: string
          description: HTML body.
          example: "<p>Thanks for reaching out. We are looking into it.</p>"
        category:
          type: string
          maxLength: 255
          description: Email Sending API category for the outbound message.
          example: "Support reply"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/EmailAttachment"
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Custom headers to add to the outbound message. The threading
            headers (`In-Reply-To`, `References`) are set automatically and
            take precedence over any you provide here.
          example:
            X-Custom-Header: "value"
        custom_variables:
          type: object
          additionalProperties:
            type: string
          description: Email Sending API custom variables for the outbound message.
          example:
            ticket_id: "12345"

    SendMessageResult:
      type: object
      required:
        - message_ids
      properties:
        message_ids:
          type: array
          description: |
            UUIDs assigned by the Email Sending API to the sent message, one per
            recipient. These are the sent message's UUIDs — not the inbound
            message ID acted on, nor an RFC `Message-ID` header value.
          items:
            type: string
          example:
            - "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"

    SendMessageError:
      type: object
      properties:
        errors:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    ThreadSummary:
      type: object
      description: |
        Summary of a thread. All aggregates are computed over the messages you
        can still access (those within the plan's retention window).
      properties:
        id:
          type: string
          example: "1700000000000123"
        subject:
          type:
            - string
            - "null"
          description: Subject of the thread's root message.
          example: "Support request"
        message_count:
          type: integer
          description: |
            Number of accessible messages in the thread. Messages sent together
            (reply-all fan-out) count once.
          example: 3
        size:
          type: integer
          description: Combined size of the accessible messages, in bytes.
          example: 24576
        first_message_at:
          type: string
          format: date-time
          example: "2026-05-08T10:30:00.000Z"
        last_received_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the most recent inbound message arrived, if any.
          example: "2026-05-08T12:05:00.000Z"
        last_sent_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the most recent outbound message was sent, if any.
          example: "2026-05-08T11:40:00.000Z"
        last_activity_at:
          type: string
          format: date-time
          description: Timestamp of the most recent message in either direction.
          example: "2026-05-08T12:05:00.000Z"
        last_message_id:
          type:
            - string
            - "null"
          description: ID of the most recent accessible message in the thread.
          example: "1700000000000789"
        senders:
          type: array
          description: Distinct `from` addresses across the accessible messages.
          items:
            type: string
          example:
            - "customer@example.com"
            - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
        recipients:
          type: array
          description: Distinct `to`/`cc`/`bcc` addresses across the accessible messages.
          items:
            type: string
          example:
            - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
            - "customer@example.com"
        attachments:
          type: array
          description: Attachments across the accessible messages, with download URLs.
          items:
            $ref: "#/components/schemas/AttachmentWithDownloadUrl"

    ThreadMessage:
      type: object
      description: |
        A message in a thread. `placeholder` entries (outside the retention
        window) carry only `visibility_status` and `direction`. `available`
        entries add the full envelope, subject, RFC headers, bodies, and
        attachments; `available` outbound entries additionally carry the
        delivery lifecycle.
      required:
        - visibility_status
        - direction
      properties:
        visibility_status:
          type: string
          enum:
            - available
            - placeholder
          example: available
        direction:
          type: string
          enum:
            - inbound
            - outbound
          example: inbound
        id:
          type: string
          description: |
            For inbound messages, the Mailtrap object ID. For outbound messages,
            the Email Sending API message UUID.
          example: "1700000000000123"
        subject:
          type:
            - string
            - "null"
          example: "Support request"
        message_id:
          type:
            - string
            - "null"
          description: Value of the `Message-ID` header.
          example: "<abc@customer.example>"
        in_reply_to:
          type:
            - string
            - "null"
          example: null
        references:
          type: array
          items:
            type: string
          example: []
        from:
          type:
            - string
            - "null"
          example: "customer@example.com"
        to:
          type: array
          items:
            type: string
          example:
            - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
        cc:
          type: array
          items:
            type: string
          example: []
        bcc:
          type: array
          items:
            type: string
          example: []
        reply_to:
          type:
            - string
            - "null"
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-05-08T10:30:00.000Z"
        email_size:
          type: integer
          description: Size of the message in bytes.
          example: 8192
        text_body:
          type:
            - string
            - "null"
          description: Decoded plain-text body. `null` when the message has no text part.
          example: "I need help with my order."
        html_body:
          type:
            - string
            - "null"
          description: Decoded HTML body. `null` when the message has no HTML part.
          example: "<p>I need help with my order.</p>"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentWithDownloadUrl"
        delivery_status:
          type:
            - string
            - "null"
          description: Delivery status of the sent message. Outbound messages only.
          example: delivered
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was delivered. Outbound messages only.
          example: "2026-05-08T11:40:05.000Z"
        bounced_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message hard-bounced, if it did. Outbound messages only.
          example: null

    Thread:
      allOf:
        - $ref: "#/components/schemas/ThreadSummary"
        - type: object
          properties:
            messages:
              type: array
              description: The thread's messages, ordered oldest first.
              items:
                $ref: "#/components/schemas/ThreadMessage"

    ThreadPagination:
      type: object
      properties:
        token:
          type:
            - string
            - "null"
          description: Cursor applied to the current page. `null` on the first page.
          example: null
        next_token:
          type:
            - string
            - "null"
          description: Cursor for the next page. `null` when there are no more results.
          example: null
        current_url:
          type: string
          format: uri
          example: "https://mailtrap.io/api/inbound/inboxes/1/threads"
        next_url:
          type:
            - string
            - "null"
          format: uri
          description: URL of the next page. `null` when there are no more results.
          example: null

    ThreadsListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ThreadSummary"
        pagination:
          $ref: "#/components/schemas/ThreadPagination"

    ThreadResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Thread"

    UnprocessableEntity:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    ForbiddenError:
      type: object
      properties:
        errors:
          type: string

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Incorrect API token

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"
          example:
            errors: Access forbidden

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Not Found

    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnprocessableEntity"
          example:
            errors:
              name:
                - has already been taken

    SendMessageAccepted:
      description: |
        Message queued for delivery. Returns the UUID(s) the Email Sending API
        assigned to the sent message, one per recipient.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SendMessageResult"
          example:
            message_ids:
              - "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"

    SendMessageBadRequest:
      description: |
        The message could not be sent. Returned for an invalid sender (for
        example a `from` on a Mailtrap-hosted inbox, or one outside the inbox's
        domain) and for validation errors rejected by the Email Sending API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SendMessageError"
          example:
            errors:
              - "'from' must be an address on the inbox's domain"

    SendMessageForbidden:
      description: |
        The caller lacks permission on the inbox, or the inbox's monthly sending
        limit has been reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SendMessageError"
          example:
            errors:
              - "Sending usage of this inbox has reached its limit."

    PayloadTooLarge:
      description: The message exceeds the maximum allowed size.
      content:
        application/json:
          schema:
