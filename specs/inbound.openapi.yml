      summary: Create a forward rule
      description: |
        Create a forward rule on the inbox. The rule, its conditions, and its
        destinations are validated and saved together: if any part is
        invalid, nothing is created.

        An inbox can have at most 5 forward rules; each rule can have at most
        5 conditions and 5 destinations.
