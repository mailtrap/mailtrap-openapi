                    references:
                      - "<abc@customer.example>"
                    from: "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                    to:
                      - "customer@example.com"
                    cc: []
                    bcc: []
                    reply_to: null
                    created_at: "2026-05-08T11:40:00.000Z"
                    email_size: 8192
                    text_body: "Happy to help — could you share your order ID?"
                    html_body: "<p>Happy to help — could you share your order ID?</p>"
                    attachments: []
                    delivery_status: delivered
                    delivered_at: "2026-05-08T11:40:05.000Z"
                    bounced_at: null
                  - visibility_status: placeholder
                    direction: inbound
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteInboundThread
      summary: Delete a thread
      description: |
        Delete a thread. Inbound messages in the thread are removed; sent
        messages are preserved.
      tags:
        - threads
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - $ref: "#/components/parameters/thread_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X DELETE https://mailtrap.io/api/inbound/inboxes/{inbox_id}/threads/{id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            const inboxId = 42;
            const threadId = "1700000000000124";
            await client.inbound.threads.delete(inboxId, threadId);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $inboxId = $_ENV['MAILTRAP_INBOUND_INBOX_ID'];
            $threads = (new MailtrapInboundClient($config))->threads($inboxId);

            $threadId = $_ENV['MAILTRAP_INBOUND_THREAD_ID'];
            $response = $threads->delete($threadId);
            echo $response->getStatusCode(); // 204
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            inbox_id = 42
            thread_id = "1700000000000124"
            client.inbound_api.threads.delete(inbox_id, thread_id)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            threads = Mailtrap::InboundThreadsAPI.new(client)

            inbox_id = 42
            thread_id = '1700000000000124'
            threads.delete(inbox_id, thread_id)
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var inboxId = 42;
            var threadId = "1700000000000124";
            await client.Inbound().Inbox(inboxId).Thread(threadId).Delete();
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            long inboxId = 42L;
            String threadId = "1700000000000124";
            client.inboundApi().threads().delete(inboxId, threadId);
      responses:
        "204":
          description: Thread deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    HeaderAuth:
      type: apiKey
      description: API token in Api-Token header
      in: header
      name: Api-Token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication

  parameters:
    folder_id:
      name: folder_id
      in: path
      required: true
      description: Inbound folder ID
      schema:
        type: integer
        example: 1

    inbox_id:
      name: inbox_id
      in: path
      required: true
      description: Inbound inbox ID
      schema:
        type: integer
        example: 1

    message_id:
      name: id
      in: path
      required: true
      description: Inbound message ID
      schema:
        type: string
        example: "1700000000000123"

    thread_id:
      name: id
      in: path
      required: true
      description: Inbound thread ID
      schema:
        type: string
        example: "1700000000000123"

  schemas:
    Folder:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Support

    FolderInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Support

    Inbox:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Support tickets
        address:
          type: string
          description: |
            The inbox's inbound address. For a standard Mailtrap-hosted inbox
            this is a unique generated address. For a custom-domain inbox it is
            the catch-all form `*@your-domain.com`, which receives mail sent to
            any address on that domain.
          example: "support-tickets-1a2b3c4d@inbound-mailtrap.io"
        domain_id:
          type: integer
          description: |
            ID of the sending domain the inbox is attached to. For a
            custom-domain inbox this is your own sending domain; for a standard
            hosted inbox it is the Mailtrap-managed domain backing the inbox.
          example: 892

    InboxInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Support tickets

    InboxCreateInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Support tickets
        domain_id:
          type: integer
          description: |
            Attach the inbox to a verified custom sending domain (one with
            inbound enabled), creating a catch-all inbox that receives mail for
            any address on that domain. Omit to create a standard Mailtrap-hosted
            inbox. Requires the custom domains feature.
          example: 894

    Attachment:
      type: object
      properties:
        attachment_id:
          type: string
          example: att-1
        size:
          type:
            - integer
            - "null"
          example: 1024
        filename:
          type:
            - string
            - "null"
          example: logo.png
        content_type:
          type:
            - string
            - "null"
          example: image/png
        content_disposition:
          type:
            - string
            - "null"
          enum:
            - attachment
            - inline
            - null
          example: inline
        content_id:
          type:
            - string
            - "null"
          description: |
            `Content-ID` header value, used to reference inline attachments
            from the HTML body.
          example: "logo@example.com"

    AttachmentWithDownloadUrl:
      allOf:
        - $ref: "#/components/schemas/Attachment"
        - type: object
          properties:
            download_url:
              type:
                - string
                - "null"
              format: uri
              description: URL to download the attachment. Expires after one hour.
              example: "https://s3.amazonaws.com/inbound-mail/att-1?X-Amz-Signature=..."
            download_url_expires_at:
              type:
                - string
                - "null"
              format: date-time
              example: "2026-05-08T11:30:00.000Z"

    Message:
      type: object
      properties:
        id:
          type: string
          description: Mailtrap object ID for the message (not the `Message-ID` header value).
          example: "1700000000000123"
        inbox_id:
          type: integer
          example: 1
        from:
          type:
            - string
            - "null"
          example: "sender@example.com"
        to:
          type: array
          items:
            type: string
          example:
            - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
        cc:
          type: array
          items:
            type: string
          example: []
        bcc:
          type: array
          items:
            type: string
          example: []
        reply_to:
          type:
            - string
            - "null"
          example: null
        subject:
          type:
            - string
            - "null"
          example: Hello
        rfc_message_id:
          type:
            - string
            - "null"
          description: Value of the original `Message-ID` header.
          example: "<abc@sender.example>"
        in_reply_to:
          type:
            - string
            - "null"
          example: null
        references:
          type: array
          items:
            type: string
          example: []
        headers:
          type:
            - object
            - "null"
          additionalProperties:
            type: string
          description: |
            Selected headers from the original message, lowercased.
          example:
            mime-version: "1.0"
            return-path: "<sender@example.com>"
        size:
          type:
            - integer
            - "null"
          description: Total size of the raw message in bytes.
          example: 4096
        html_size:
          type:
            - integer
            - "null"
          description: Size of the HTML body in bytes. Zero if the message has no HTML part.
          example: 512
        text_size:
          type:
            - integer
            - "null"
          description: Size of the plain-text body in bytes. Zero if the message has no text part.
          example: 128
        received_at:
          type: string
          format: date-time
          example: "2026-05-08T10:30:00.000Z"
        thread_id:
          type:
            - string
            - "null"
          description: |
            ID of the thread this message belongs to. Use it with the Threads
            endpoints to fetch the full conversation.
          example: "1700000000000124"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    MessageDetails:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          properties:
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/AttachmentWithDownloadUrl"
            raw_message_url:
              type:
                - string
                - "null"
              format: uri
              description: |
                URL to download the raw `.eml` file. Expires after one hour.
              example: "https://s3.amazonaws.com/inbound-mail/raw.eml?X-Amz-Signature=..."
            raw_message_expires_at:
              type:
                - string
                - "null"
              format: date-time
              example: "2026-05-08T11:30:00.000Z"
            html_body:
              type:
                - string
                - "null"
              description: Decoded HTML body. `null` when the message has no HTML part.
              example: "<html><body>Hello</body></html>"
            text_body:
              type:
                - string
                - "null"
              description: Decoded plain-text body. `null` when the message has no text part.
              example: "Hello"

    MessagesListResponse:
      type: object
      required:
        - data
        - total_count
        - last_id
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        total_count:
          type: integer
          description: Total number of messages within the retention window.
          example: 1
        last_id:
          type:
            - string
            - "null"
          description: |
            Cursor for the next page. `null` when there are no more results.
          example: null

    Address:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "recipient@example.com"
        name:
          type: string
          example: "Jane Doe"

    EmailAttachment:
      type: object
      required:
        - content
        - filename
      properties:
        content:
          type: string
          description: Base64-encoded attachment content.
          example: "PGh0bWw+PGJvZHk+SGVsbG88L2JvZHk+PC9odG1sPg=="
        filename:
          type: string
          example: "invoice.pdf"
        type:
          type: string
          description: MIME type of the attachment.
          example: "application/pdf"
        disposition:
          type: string
          enum:
            - attachment
            - inline
          default: attachment
          example: attachment
        content_id:
          type: string
          description: |
            `Content-ID` used to reference an inline attachment from the HTML
            body. Only relevant when `disposition` is `inline`.
          example: "invoice@example.com"

    SendMessageInput:
      type: object
      description: |
        Options for the sent message. All fields are optional. `reply` and
        `reply_all` must carry a body (`text` and/or `html`); `forward` may omit
        it, since the original message is quoted automatically. `forward` also
        requires at least one recipient in `to`. Addresses use the Email
        Sending API `{ email, name }` shape.
      properties:
        from:
          allOf:
            - $ref: "#/components/schemas/Address"
          description: |
            Sender address. Rejected for Mailtrap-hosted inboxes (they always
            send from their own address); required for custom-domain inboxes,
            where the address must belong to the inbox's domain.
        to:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Address"
        cc:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Address"
        bcc:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Address"
        reply_to:
          $ref: "#/components/schemas/Address"
        text:
          type: string
          description: Plain-text body.
          example: "Thanks for reaching out. We are looking into it."
        html:
          type: string
          description: HTML body.
          example: "<p>Thanks for reaching out. We are looking into it.</p>"
        category:
          type: string
          maxLength: 255
          description: Email API category for the sent message.
          example: "Support reply"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/EmailAttachment"
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom headers to add to the sent message.
          example:
            X-Custom-Header: "value"
        custom_variables:
          type: object
          additionalProperties:
            type: string
          description: Email API custom variables for the sent message.
          example:
            ticket_id: "12345"

    SendMessageResult:
      type: object
      required:
        - message_ids
      properties:
        message_ids:
          type: array
          description: |
            UUIDs assigned by the Email API to the sent message, one per
            recipient. These are the sent message's UUIDs — not the inbound
            message ID acted on, nor an RFC `Message-ID` header value.
          items:
            type: string
          example:
            - "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"

    SendMessageError:
      type: object
      properties:
        errors:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    ThreadSummary:
      type: object
      description: |
        Summary of a thread. All aggregates are computed over the messages you
        can still access (those within the plan's retention window).
      properties:
        id:
          type: string
          example: "1700000000000123"
        subject:
          type:
            - string
            - "null"
          description: Subject of the thread's root message.
          example: "Support request"
        message_count:
          type: integer
          description: |
            Number of accessible messages in the thread. Messages sent together
            (reply-all fan-out) count once.
          example: 3
        size:
          type: integer
          description: Combined size of the accessible messages, in bytes.
          example: 24576
        first_message_at:
          type: string
          format: date-time
          example: "2026-05-08T10:30:00.000Z"
        last_received_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the most recent inbound message arrived, if any.
          example: "2026-05-08T12:05:00.000Z"
        last_sent_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the most recent message was sent, if any.
          example: "2026-05-08T11:40:00.000Z"
        last_activity_at:
          type: string
          format: date-time
          description: Timestamp of the most recent message in either direction.
          example: "2026-05-08T12:05:00.000Z"
        last_message_id:
          type:
            - string
            - "null"
          description: ID of the most recent accessible message in the thread.
          example: "1700000000000789"
        senders:
          type: array
          description: Distinct `from` addresses across the accessible messages.
          items:
            type: string
          example:
            - "customer@example.com"
            - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
        recipients:
          type: array
          description: Distinct `to`/`cc`/`bcc` addresses across the accessible messages.
          items:
            type: string
          example:
            - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
            - "customer@example.com"
        attachments:
          type: array
          description: Attachments across the accessible messages, with download URLs.
          items:
            $ref: "#/components/schemas/AttachmentWithDownloadUrl"

    ThreadMessage:
      type: object
      description: |
        A message in a thread. `placeholder` entries (outside the retention
        window) carry only `visibility_status` and `direction`. `available`
        entries add the full envelope, subject, RFC headers, bodies, and
        attachments; `available` sent entries additionally carry the
        delivery lifecycle.
      required:
        - visibility_status
        - direction
      properties:
        visibility_status:
          type: string
          enum:
            - available
            - placeholder
          example: available
        direction:
          type: string
          enum:
            - inbound
            - outbound
          example: inbound
        id:
          type: string
          description: |
            For inbound messages, the Mailtrap object ID. For sent messages,
            the Email API message UUID.
          example: "1700000000000123"
        message_group_id:
          type:
            - string
            - "null"
          description: |
            Groups the copies of one logical message that was fanned out to
            multiple recipients (e.g. a reply-all). Messages sharing a
            `message_group_id` count once toward the thread's `message_count`.
            `null` for a standalone message.
          example: null
        subject:
          type:
            - string
            - "null"
          example: "Support request"
        rfc_message_id:
          type:
            - string
            - "null"
          description: Value of the `Message-ID` header.
          example: "<abc@customer.example>"
        in_reply_to:
          type:
            - string
            - "null"
          example: null
        references:
          type: array
          items:
            type: string
          example: []
        from:
          type:
            - string
            - "null"
          example: "customer@example.com"
        to:
          type: array
          items:
            type: string
          example:
            - "support-tickets-1a2b3c4d@inbound-mailtrap.io"
        cc:
          type: array
          items:
            type: string
          example: []
        bcc:
          type: array
          items:
            type: string
          example: []
        reply_to:
          type:
            - string
            - "null"
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-05-08T10:30:00.000Z"
        email_size:
          type: integer
          description: Size of the message in bytes.
          example: 8192
        text_body:
          type:
            - string
            - "null"
          description: Decoded plain-text body. `null` when the message has no text part.
          example: "I need help with my order."
        html_body:
          type:
            - string
            - "null"
          description: Decoded HTML body. `null` when the message has no HTML part.
          example: "<p>I need help with my order.</p>"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentWithDownloadUrl"
        delivery_status:
          type:
            - string
            - "null"
          description: Delivery status. Sent messages only.
          example: delivered
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was delivered. Sent messages only.
          example: "2026-05-08T11:40:05.000Z"
        bounced_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message hard-bounced, if it did. Sent messages only.
          example: null

    Thread:
      allOf:
        - $ref: "#/components/schemas/ThreadSummary"
        - type: object
          properties:
            messages:
              type: array
              description: The thread's messages, ordered oldest first.
              items:
                $ref: "#/components/schemas/ThreadMessage"

    ThreadsListResponse:
      type: object
      required:
        - data
        - total_count
        - last_id
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ThreadSummary"
        total_count:
          type: integer
          description: Total number of threads matching the query.
          example: 1
        last_id:
          type:
            - string
            - "null"
          description: |
            Cursor for the next page. `null` when there are no more results.
          example: null

    UnprocessableEntity:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    ForbiddenError:
      type: object
      properties:
        errors:
          type: string

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Incorrect API token

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"
          example:
            errors: Access forbidden

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Not Found

    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnprocessableEntity"
          example:
            errors:
              name:
                - has already been taken

    SendMessageAccepted:
      description: |
        Message queued for delivery. Returns the UUID(s) the Email API
        assigned to the sent message, one per recipient.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SendMessageResult"
          example:
            message_ids:
              - "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"

    SendMessageBadRequest:
      description: |
        The message could not be sent. Returned for an invalid sender (for
        example a `from` on a Mailtrap-hosted inbox, or one outside the inbox's
        domain) and for validation errors rejected by the Email API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SendMessageError"
          example:
            errors:
              - "'from' must be an address on the inbox's domain"

    SendMessageForbidden:
      description: |
        The caller lacks permission on the inbox, or the inbox's monthly sending
        limit has been reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SendMessageError"
          example:
            errors:
              - "Sending usage of this inbox has reached its limit."

    PayloadTooLarge:
      description: The message exceeds the maximum allowed size.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SendMessageError"
          example:
            errors:
              - "Message is too large"

    TooManyRequests:
      description: Too many requests. Retry after a short delay.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SendMessageError"
          example:
            errors:
              - "Too many requests"
