                        matchType: InboundForwardRule::MATCH_TYPE_SENDER,
                        operator: InboundForwardRule::OPERATOR_ENDS_WITH,
                        value: '@billing.example.com'
                    ),
                ],
                destinations: [new InboundForwardRuleDestination('finance@example.com')],
            ));
