  /api/inbound/inboxes/{inbox_id}/threads:
    get:
      operationId: listInboundThreads
      summary: List threads
      description: |
        Returns the inbox's conversation threads, ordered by most recent
        activity first.

        Only threads and messages within your plan's retention window are
        included; the per-thread aggregates (message count, size, senders,
        recipients, attachments) are computed over those accessible messages.

        Use `search` to narrow the list to threads whose subject, or any
        message's `from`, `to`, `cc`, or `bcc` address, contains the given
        text.

        Results use cursor pagination, up to 100 threads per page. When more
        results are available the response includes a `last_id`; pass it
        back as the `last_id` query parameter (together with the same
        `search`, if any) to get the next page. When `last_id` is `null` you
        have reached the end.
      tags:
        - threads
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - name: last_id
          in: query
          required: false
          description: |
            Opaque cursor from the previous response's `last_id`. Omit on the
            first request. A malformed cursor returns `400`.
          schema:
            type: string
            example: "WzE3NzgyNDE5MDAwMDAsIjE3MDAwMDAwMDAwMDAxMjMiXQ=="
        - name: search
          in: query
          required: false
          description: |
            Case-insensitive substring match against the thread subject and
            the `from`, `to`, `cc`, and `bcc` addresses of its messages.
            Wildcard characters (`*`, `?`) are matched literally. Leading and
            trailing whitespace is ignored; a blank value returns the
            unfiltered list. `total_count` reflects the filtered result.
          schema:
            type: string
            maxLength: 256
            example: "acme"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET 'https://mailtrap.io/api/inbound/inboxes/{inbox_id}/threads' \
              -H 'Authorization: Bearer YOUR_API_KEY'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            // Pass { last_id: page.last_id } to fetch the next page.
            const inboxId = 42;
            const page = await client.inbound.threads.getList(inboxId);
            console.log(page.data, page.total_count, page.last_id);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $inboxId = $_ENV['MAILTRAP_INBOUND_INBOX_ID'];
            $threads = (new MailtrapInboundClient($config))->threads($inboxId);

            // Pass a last_id string to fetch the next page.
            $response = $threads->getList();
            var_dump(ResponseHelper::toArray($response));
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            # Pass last_id=page.last_id to fetch the next page.
            inbox_id = 42
            page = client.inbound_api.threads.get_list(inbox_id)
            print(page.data, page.total_count, page.last_id)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            threads = Mailtrap::InboundThreadsAPI.new(client)

            # Pass last_id: page.last_id to fetch the next page.
            inbox_id = 42
            page = threads.list(inbox_id)
            puts page.total_count
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var inboxId = 42;
            var page = await client.Inbound().Inbox(inboxId).Threads().List();
            Console.WriteLine(page.TotalCount);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            // Pass the previous page's last id to paginate (null for the first page).
            long inboxId = 42L;
            var page = client.inboundApi().threads().list(inboxId, null);
            System.out.println(page.getTotalCount());
      responses:
        "200":
          description: List of threads
          content:
