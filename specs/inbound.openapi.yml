            rule = forward_rules.create(
              inbox_id,
              name: 'Copy billing mail to finance',
              conditions: [{ match_type: 'sender', operator: 'ends_with', value: '@billing.example.com' }],
              destinations: [{ email: 'finance@example.com' }]
