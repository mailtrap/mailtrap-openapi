  /api/inbound/inboxes/{inbox_id}/threads/{id}:
    get:
      operationId: getInboundThread
      summary: Get a thread
      description: |
        Returns a single thread with its messages embedded, ordered oldest
        first.

        Each message carries a `visibility_status`:

        - `available` — the message is within your plan's retention window. The
          full envelope, subject, RFC headers, decoded bodies, and attachment
          download URLs are included. Sent messages also carry their delivery
          outcome in `delivery`; received messages carry their forward-rule
          outcomes in `forwards`.
        - `placeholder` — the message is outside the retention window, or is
          no longer stored. Only `visibility_status` and `direction` are
          returned; every other field is omitted and no attachment download
          URLs are issued.

        The thread-level aggregates (`message_count`, `size`, `senders`,
        `recipients`, `attachments`, `last_message_id`) are computed over the
        `available` messages only.
      tags:
        - threads
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - $ref: "#/components/parameters/thread_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET https://mailtrap.io/api/inbound/inboxes/{inbox_id}/threads/{id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            const inboxId = 42;
            const threadId = "1700000000000124";
            const thread = await client.inbound.threads.get(inboxId, threadId);
            console.log(thread);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $inboxId = $_ENV['MAILTRAP_INBOUND_INBOX_ID'];
            $threads = (new MailtrapInboundClient($config))->threads($inboxId);

            $threadId = $_ENV['MAILTRAP_INBOUND_THREAD_ID'];
