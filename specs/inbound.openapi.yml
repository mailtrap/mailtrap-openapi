  /api/inbound/inboxes/{inbox_id}/messages:
    get:
      operationId: listInboundMessages
      summary: List messages
      description: |
        Returns inbound messages received by the inbox, ordered by
        `received_at` descending.

        List responses use cursor pagination. When more results are available
        the response includes a `last_id`; pass it back as the `last_id` query
        parameter to get the next page. When `last_id` is `null` you have
        reached the end.
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/inbox_id"
        - name: last_id
          in: query
          required: false
          description: |
            ID of the last message from the previous page. Pass the `last_id`
            value returned by the previous response to fetch the next page.
            Omit on the first request.
          schema:
            type: string
            example: "1700000000000123"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET 'https://mailtrap.io/api/inbound/inboxes/{inbox_id}/messages' \
              -H 'Authorization: Bearer YOUR_API_KEY'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            // Pass { last_id: page.last_id } to fetch the next page.
            const inboxId = 42;
            const page = await client.inbound.messages.getList(inboxId);
            console.log(page.data, page.total_count, page.last_id);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $inboxId = $_ENV['MAILTRAP_INBOUND_INBOX_ID'];
            $messages = (new MailtrapInboundClient($config))->messages($inboxId);

            // Pass a last_id string to fetch the next page.
            $response = $messages->getList();
            var_dump(ResponseHelper::toArray($response));
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            # Pass last_id=page.last_id to fetch the next page.
            inbox_id = 42
            page = client.inbound_api.messages.get_list(inbox_id)
            print(page.data, page.total_count, page.last_id)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            messages = Mailtrap::InboundMessagesAPI.new(client)

            # Pass last_id: page.last_id to fetch the next page.
            inbox_id = 42
            page = messages.list(inbox_id)
            puts page.total_count
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var inboxId = 42;
            var page = await client.Inbound().Inbox(inboxId).Messages().List();
            Console.WriteLine(page.TotalCount);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            // Pass the previous page's last id to paginate (null for the first page).
            long inboxId = 42L;
            var page = client.inboundApi().messages().list(inboxId, null);
            System.out.println(page.getTotalCount());
      responses:
