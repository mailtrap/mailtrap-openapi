openapi: 3.1.0
info:
  title: Inbound
  version: 2.0.0
  description: |
    Receive and inspect inbound email in Mailtrap. Inboxes are organized into
    folders and accept messages at their generated inbound address. Use the
    Messages endpoints to list, fetch, and delete received mail, and pair them
    with an `inbound_receiving` webhook to be notified the moment a new
    message arrives.

    For a complete guide, see [Inbound](https://docs.mailtrap.io/getting-started/inbound-email).
  contact:
    name: Mailtrap Support
    url: "https://docs.mailtrap.io"
    email: support@mailtrap.io
  license:
    name: Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)
    url: "https://creativecommons.org/licenses/by-sa/4.0/"
  x-logo:
    url: "https://mailtrap.io/wp-content/uploads/2021/04/mailtrap-logo.svg"

servers:
  - description: Mailtrap API
    url: "https://mailtrap.io"

security:
  - HeaderAuth: []
  - BearerAuth: []

tags:
  - name: folders
    x-page-title: Folders
    x-page-description: Organize inbound inboxes
    description: |
      Folders group inbound inboxes within an account. Every inbox belongs to
      exactly one folder.

  - name: inboxes
    x-page-title: Inboxes
    x-page-description: Receive inbound email
    description: |
      An inbox is the destination for inbound email. Each inbox is created
      inside a folder and gets a unique generated address that can receive
      mail from any sender.

  - name: messages
    x-page-title: Messages
    x-page-description: List, inspect, and respond to received messages
    description: |
      Inbound messages are the emails delivered to an inbox. Use these
      endpoints to page through recent messages, fetch the full body and
      attachments, reply to or forward a message, or delete one you no longer
      need.

  - name: threads
    x-page-title: Threads
    x-page-description: Group related messages into conversations
    description: |
      A thread groups the inbound and sent messages that belong to the
      same conversation. Use these endpoints to page through an inbox's
      threads, fetch a single thread with its messages embedded, or delete a
      thread.

paths:
  /api/inbound/folders:
    get:
      operationId: listInboundFolders
      summary: List folders
      description: Returns all inbound folders in the account.
      tags:
        - folders
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET https://mailtrap.io/api/inbound/folders \
              -H 'Authorization: Bearer YOUR_API_KEY'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            const folders = await client.inbound.folders.getList();
            console.log(folders);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $folders = (new MailtrapInboundClient($config))->folders();

            $response = $folders->getList();
            var_dump(ResponseHelper::toArray($response));
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            folders = client.inbound_api.folders.get_list()
            print(folders)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            folders = Mailtrap::InboundFoldersAPI.new(client)

            puts folders.list
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var folders = await client.Inbound().Folders().GetAll();
            Console.WriteLine(folders.Count);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            var folders = client.inboundApi().folders().getList();
            System.out.println(folders);
      responses:
        "200":
          description: List of folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
              example:
                - id: 1
                  name: Support
                - id: 2
                  name: Sales
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createInboundFolder
      summary: Create a folder
      description: Create a new inbound folder.
      tags:
        - folders
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X POST https://mailtrap.io/api/inbound/folders \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{ "name": "Support" }'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            const folder = await client.inbound.folders.create({ name: "Support" });
            console.log(folder);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\DTO\Request\Inbound\CreateInboundFolder;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $folders = (new MailtrapInboundClient($config))->folders();

            $response = $folders->create(new CreateInboundFolder('Support'));
            var_dump(ResponseHelper::toArray($response));
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            folder = client.inbound_api.folders.create(
                mt.CreateInboundFolderParams(name="Support")
            )
            print(folder)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            folders = Mailtrap::InboundFoldersAPI.new(client)

            folder = folders.create(name: 'Support')
            puts folder
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;
            using Mailtrap.Inbound.Requests;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var folder = await client.Inbound().Folders()
                .Create(new CreateInboundFolderRequest { Name = "Support" });
            Console.WriteLine(folder.Id);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;
            import io.mailtrap.model.request.inbound.CreateInboundFolderRequest;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            var folder = client.inboundApi().folders()
                .create(CreateInboundFolderRequest.builder().name("Support").build());
            System.out.println(folder);
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
              example:
                id: 1
                name: Support
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/inbound/folders/{folder_id}:
    get:
      operationId: getInboundFolder
      summary: Get a folder
      description: Returns a single inbound folder.
      tags:
        - folders
      parameters:
        - $ref: "#/components/parameters/folder_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET https://mailtrap.io/api/inbound/folders/{folder_id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            const folderId = 1;
            const folder = await client.inbound.folders.get(folderId);
            console.log(folder);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $folders = (new MailtrapInboundClient($config))->folders();

            $folderId = $_ENV['MAILTRAP_INBOUND_FOLDER_ID'];
            $response = $folders->getById($folderId);
            var_dump(ResponseHelper::toArray($response));
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            folder_id = 1
            folder = client.inbound_api.folders.get_by_id(folder_id)
            print(folder)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            folders = Mailtrap::InboundFoldersAPI.new(client)

            folder_id = 1
            puts folders.get(folder_id)
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var folderId = 1;
            var folder = await client.Inbound().Folder(folderId).GetDetails();
            Console.WriteLine(folder.Name);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            long folderId = 1L;
            var folder = client.inboundApi().folders().getById(folderId);
            System.out.println(folder);
      responses:
        "200":
          description: Folder details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateInboundFolder
      summary: Update a folder
      description: Update an inbound folder.
      tags:
        - folders
      parameters:
        - $ref: "#/components/parameters/folder_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X PATCH https://mailtrap.io/api/inbound/folders/{folder_id} \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{ "name": "Customer Success" }'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            const folderId = 1;
            const folder = await client.inbound.folders.update(folderId, { name: "Customer Success" });
            console.log(folder);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\DTO\Request\Inbound\UpdateInboundFolder;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $folders = (new MailtrapInboundClient($config))->folders();

            $folderId = $_ENV['MAILTRAP_INBOUND_FOLDER_ID'];
            $response = $folders->update($folderId, new UpdateInboundFolder('Customer Success'));
            var_dump(ResponseHelper::toArray($response));
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            folder_id = 1
            folder = client.inbound_api.folders.update(
                folder_id, mt.UpdateInboundFolderParams(name="Customer Success")
            )
            print(folder)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            folders = Mailtrap::InboundFoldersAPI.new(client)

            folder_id = 1
            puts folders.update(folder_id, name: 'Customer Success')
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;
            using Mailtrap.Inbound.Requests;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var folderId = 1;
            var folder = await client.Inbound().Folder(folderId)
                .Update(new UpdateInboundFolderRequest { Name = "Customer Success" });
            Console.WriteLine(folder.Name);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;
            import io.mailtrap.model.request.inbound.UpdateInboundFolderRequest;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            long folderId = 1L;
            var folder = client.inboundApi().folders()
                .update(folderId, UpdateInboundFolderRequest.builder().name("Customer Success").build());
            System.out.println(folder);
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "200":
          description: Folder updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: deleteInboundFolder
      summary: Delete a folder
      description: |
        Permanently delete an inbound folder along with all of its inboxes.
      tags:
        - folders
      parameters:
        - $ref: "#/components/parameters/folder_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X DELETE https://mailtrap.io/api/inbound/folders/{folder_id} \
              -H 'Authorization: Bearer YOUR_API_KEY'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            const folderId = 1;
            await client.inbound.folders.delete(folderId);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $folders = (new MailtrapInboundClient($config))->folders();

            $folderId = $_ENV['MAILTRAP_INBOUND_FOLDER_ID'];
            $response = $folders->delete($folderId);
            echo $response->getStatusCode(); // 204
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            folder_id = 1
            client.inbound_api.folders.delete(folder_id)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            folders = Mailtrap::InboundFoldersAPI.new(client)

            folder_id = 1
            folders.delete(folder_id)
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var folderId = 1;
            await client.Inbound().Folder(folderId).Delete();
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            long folderId = 1L;
            client.inboundApi().folders().delete(folderId);
      responses:
        "204":
          description: Folder deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/inbound/folders/{folder_id}/inboxes:
    get:
      operationId: listInboundInboxes
      summary: List inboxes
      description: Returns all inboxes in a folder.
      tags:
        - inboxes
      parameters:
        - $ref: "#/components/parameters/folder_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X GET https://mailtrap.io/api/inbound/folders/{folder_id}/inboxes \
              -H 'Authorization: Bearer YOUR_API_KEY'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            const folderId = 1;
            const inboxes = await client.inbound.inboxes.getList(folderId);
            console.log(inboxes);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $folderId = $_ENV['MAILTRAP_INBOUND_FOLDER_ID'];
            $inboxes = (new MailtrapInboundClient($config))->inboxes($folderId);

            $response = $inboxes->getList();
            var_dump(ResponseHelper::toArray($response));
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            folder_id = 1
            inboxes = client.inbound_api.inboxes.get_list(folder_id)
            print(inboxes)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            inboxes = Mailtrap::InboundInboxesAPI.new(client)

            folder_id = 1
            puts inboxes.list(folder_id)
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var folderId = 1;
            var inboxes = await client.Inbound().Folder(folderId).Inboxes().GetAll();
            Console.WriteLine(inboxes.Count);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            long folderId = 1L;
            var inboxes = client.inboundApi().inboxes().getList(folderId);
            System.out.println(inboxes);
      responses:
        "200":
          description: List of inboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inbox"
              example:
                - id: 1
                  name: Support tickets
                  address: "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                  domain_id: 892
                - id: 2
                  name: Replies
                  address: "*@your-domain.com"
                  domain_id: 894
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: createInboundInbox
      summary: Create an inbox
      description: |
        Create a new inbox in a folder. By default Mailtrap generates the
        inbox `address` automatically based on the `name`.

        To create a catch-all inbox on your own domain, pass `domain_id` — the
        ID of a verified custom sending domain with inbound enabled. The inbox
        then receives mail sent to any address on that domain, and its `address`
        is returned as `*@your-domain.com`.
      tags:
        - inboxes
      parameters:
        - $ref: "#/components/parameters/folder_id"
      x-codeSamples:
        - lang: shell
          label: "cURL"
          source: |
            curl -X POST https://mailtrap.io/api/inbound/folders/{folder_id}/inboxes \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{ "name": "Support tickets" }'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const client = new MailtrapClient({ token: "YOUR_API_KEY" });

            // Omit domain_id for a Mailtrap-hosted inbox; pass it for a custom-domain inbox.
            const folderId = 1;
            const inbox = await client.inbound.inboxes.create(folderId, { name: "Support tickets" });
            console.log(inbox);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\DTO\Request\Inbound\CreateInboundInbox;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapInboundClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $folderId = $_ENV['MAILTRAP_INBOUND_FOLDER_ID'];
            $inboxes = (new MailtrapInboundClient($config))->inboxes($folderId);

            // Omit the domain id for a Mailtrap-hosted inbox; pass it for a custom-domain inbox.
            $response = $inboxes->create(new CreateInboundInbox('Support tickets'));
            var_dump(ResponseHelper::toArray($response));
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            # Omit domain_id for a Mailtrap-hosted inbox; pass it for a custom-domain inbox.
            folder_id = 1
            inbox = client.inbound_api.inboxes.create(
                folder_id, mt.CreateInboundInboxParams(name="Support tickets")
            )
            print(inbox)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            inboxes = Mailtrap::InboundInboxesAPI.new(client)

            # Omit domain_id for a Mailtrap-hosted inbox; pass it for a custom-domain inbox.
            folder_id = 1
            inbox = inboxes.create(folder_id, name: 'Support tickets')
            puts inbox
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;
            using Mailtrap.Inbound.Requests;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            // Omit DomainId for a Mailtrap-hosted inbox; set it for a custom-domain inbox.
            var folderId = 1;
            var inbox = await client.Inbound().Folder(folderId).Inboxes()
                .Create(new CreateInboundInboxRequest { Name = "Support tickets" });
            Console.WriteLine(inbox.Id);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;
            import io.mailtrap.model.request.inbound.CreateInboundInboxRequest;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            // Omit domainId for a Mailtrap-hosted inbox; set it for a custom-domain inbox.
            long folderId = 1L;
            var inbox = client.inboundApi().inboxes()
                .create(folderId, CreateInboundInboxRequest.builder().name("Support tickets").build());
            System.out.println(inbox);
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxCreateInput"
      responses:
        "201":
          description: Inbox created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
              examples:
                mailtrapHosted:
                  summary: Mailtrap-hosted inbox
                  value:
                    id: 1
                    name: Support tickets
                    address: "support-tickets-1a2b3c4d@inbound-mailtrap.io"
                    domain_id: 892
                customDomain:
