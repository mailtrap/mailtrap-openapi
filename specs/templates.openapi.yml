          description: Error message
          example: Incorrect API token
      example:
        error: Incorrect API token

    PermissionsDeniedResponse:
      title: PermissionsDeniedResponse
      type: object
      properties:
        errors:
          type: string
          example: Account access forbidden
      example:
        errors: Account access forbidden

    NotFoundResponse:
      title: NotFoundResponse
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: Not Found
      example:
        error: Not Found

    EmailTemplateRequest:
      title: EmailTemplateRequest
      type: object
      required:
        - email_template
      properties:
        email_template:
          type: object
          required:
            - name
            - subject
            - category
          properties:
            name:
              type: string
              maxLength: 255
            category:
              type: string
              maxLength: 255
            subject:
              type: string
              maxLength: 255
            body_text:
              type: string
              maxLength: 10000000
            body_html:
              type: string
              maxLength: 10000000
      example:
        email_template:
          name: My Email Template
          subject: Promotional Email
          category: Promotional
          body_html: <div>Template Body</div>
          body_text: Template Body

    EmailTemplateResponse:
      title: EmailTemplateResponse
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        category:
          type: string
          maxLength: 255
        subject:
          type: string
          maxLength: 255
        body_text:
          type: string
          maxLength: 10000000
        body_html:
          type: string
          maxLength: 10000000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 26730
        uuid: '018dd5e3-f6d2-7c00-8f9b-e5c3f2d8a132'
        name: My Email Template
        subject: Promotional Email
        category: Promotional
        body_html: <div>Template Body</div>
        body_text: Template Body
        created_at: '2021-01-01T00:00:00Z'
        updated_at: '2021-01-01T00:00:00Z'

  responses:
    Unauthorized:
      description: Returns unauthorized error message. Check your credentials.
