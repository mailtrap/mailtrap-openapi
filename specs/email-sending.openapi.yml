                  url: 'https://example.com/mailtrap/webhooks'
                  active: true
                  webhook_type: audit_log
                  payload_format: json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    HeaderAuth:
      type: apiKey
      description: API token in Api-Token header
      in: header
      name: Api-Token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication

  parameters:
    domain_id:
      name: domain_id
      in: path
      required: true
      description: Domain ID
      schema:
        type: integer
        example: 1

    suppression_id:
      name: suppression_id
      in: path
      required: true
      description: The suppression UUID
      schema:
        type: string
        format: uuid
        example: 64d71bf3-1276-417b-86e1-8e66f138acfe

    tracking_opt_out_id:
      name: tracking_opt_out_id
      in: path
      required: true
      description: The tracking opt-out UUID
      schema:
        type: string
        format: uuid
        example: 64d71bf3-1276-417b-86e1-8e66f138acfe

    sending_message_id:
      name: sending_message_id
      in: path
      required: true
      description: Message UUID
      schema:
        type: string
        format: uuid

    webhook_id:
      name: webhook_id
      in: path
      required: true
      description: Webhook ID
      schema:
        type: integer
        example: 1

    StartDateQueryFilter:
      name: start_date
      description: Start date for which to include the results.
      in: query
      required: true
      schema:
        type: string
        format: date
        example: '2025-01-01'
    EndDateQueryFilter:
      name: end_date
      description: End date for which to include the results.
      in: query
      required: true
      schema:
        type: string
        format: date
        example: '2025-12-31'
    DomainIDsQueryFilter:
      name: 'domain_ids[]'
      description: 'IDs of the domains for which to include the results. If not provided, results for all domains will be included.'
      in: query
      schema:
        type: array
        items:
          type: integer
          format: int64
        example:
          - 3938
          - 3939
    SendingStreamsQueryFilter:
      name: 'sending_streams[]'
      description: 'Sending streams for which to include the results. If not provided, results for all sending streams will be included.'
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - transactional
            - bulk
        example:
          - transactional
          - bulk
    CategoriesQueryFilter:
      name: 'categories[]'
      description: 'Categories for which to include the results. If not provided, results for all categories will be included.'
      in: query
      schema:
        type: array
        items:
          type: string
        example:
          - Welcome Email
          - Password Reset
    ESPsQueryFilter:
      name: 'email_service_providers[]'
      description: 'Email service providers for which to include the results. If not provided, results for all ESPs will be included.'
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - Google
            - Yahoo
            - Outlook
            - Hey
            - Google Workspace
            - Zoho Email
            - ProtonMail
            - Yandex
            - iCloud
            - Office 365
            - Amazon SES (Simple Email Service)
            - Proofpoint Email Protection
            - Mimecast Email Protection
            - GMX.net
            - Rackspace
            - OVH hosted
            - Linode hosted
            - GoDaddy
            - Symantec Email Protection
            - Barracuda Email Protection
            - Cisco Email Protection
            - FastMail
            - Naver
            - Seznam
            - Comcast
            - Spectrum
        example:
          - Google
          - Yahoo

  schemas:
    Domain:
      type: object
      properties:
        id:
          type: integer
        domain_name:
          type: string
        demo:
          type: boolean
        compliance_status:
          type: string
          description: |
            Indicates the compliance verification status of the domain.
            The domain must reach `compliant` status before you can send emails
            in production.

            - `demo` - A demo domain provided by Mailtrap. Can only send emails to the account owner.
            - `demo_exhausted` - A demo domain that has used up its sending allowance. Cannot send emails.
            - `unverified_dns` - Domain DNS records have not been verified yet. Open your domain on the [Domains](https://mailtrap.io/domains) page and follow the [Sending Domain Setup](https://docs.mailtrap.io/email-api-smtp/setup/sending-domain) guide.
            - `missing_company_info` - Account is missing required company information. Go to [Company Information](https://mailtrap.io/settings/account?current_tab=company_information) and fill in the required details.
            - `under_review` - Domain is undergoing automatic compliance review. No action needed — typically completes within 2 minutes.
            - `awaiting_questionnaire` - Automatic review required additional information. Open your domain on the [Domains](https://mailtrap.io/domains) page and fill in the compliance questionnaire.
            - `awaiting_card_verification` - Compliance questionnaire was submitted but credit card identity verification is still needed. Open your domain on the [Domains](https://mailtrap.io/domains) page and enter card details. The charged amount is refunded immediately and the card is not stored.
            - `non_compliant` - Domain did not pass compliance checks. Sending is not allowed. Contact [Mailtrap Support](mailto:support@mailtrap.io) for details and next steps.
            - `compliant` - Domain has passed all compliance checks and is ready to send emails.
            - `suspended` - Domain sending has been suspended. Contact [Mailtrap Support](mailto:support@mailtrap.io) to resolve the issue.
          enum:
            - demo
            - demo_exhausted
            - unverified_dns
            - missing_company_info
            - under_review
            - awaiting_questionnaire
            - awaiting_card_verification
            - non_compliant
            - compliant
            - suspended
        dns_verified:
          type: boolean
        dns_verified_at:
          type:
            - string
            - 'null'
          example: '2024-12-26T09:40:44.161Z'
        dns_records:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              domain:
                type: string
              name:
                type: string
              status:
                type: string
                enum:
                  - pass
                  - fail
                  - unchecked
                  - missing
                  - softfail
                  - network_error
              type:
                type: string
              value:
                type: string
        open_tracking_enabled:
          type: boolean
        click_tracking_enabled:
          type: boolean
        tracking_opt_out_enabled:
          type: boolean
          description: |
            When enabled, recipients can opt out of open and click tracking via a link in tracked emails.
            Requires open or click tracking to be enabled.
        auto_unsubscribe_link_enabled:
          type: boolean
        custom_domain_tracking_enabled:
          type: boolean
        health_alerts_enabled:
          type: boolean
        critical_alerts_enabled:
          type: boolean
        alert_recipient_email:
          type:
            - string
            - 'null'
        inbound_enabled:
          type: boolean
          description: |
            Whether inbound email is enabled for this domain. When enabled, an
            `MX` record (`key: inbound_mx`) is added to `dns_records` for inbound
            mail; see `inbound_verified`.
        inbound_verified:
          type: boolean
          description: |
            Whether the domain's inbound MX records have been verified. Inbound
            mail is only accepted once this is `true`.
        permissions:
          type: object
          properties:
            can_read:
              type: boolean
            can_update:
              type: boolean
            can_destroy:
              type: boolean
      example:
        id: 435
        domain_name: mailtrap.io
        demo: false
        compliance_status: compliant
        dns_verified: true
        dns_verified_at: '2024-12-26T09:40:44.161Z'
        dns_records:
          - key: verification
            domain: ve6wza2rbpe60x7z.mailtrap.io
            type: CNAME
            value: smtp.mailtrap.live
            status: pass
            name: ve6wza2rbpe60x7z
          - key: dkim1
            domain: rwmt1._domainkey.mailtrap.io
            type: CNAME
            value: rwmt1.dkim.smtp.mailtrap.live
            status: pass
            name: rwmt1._domainkey
          - key: dkim2
            domain: rwmt2._domainkey.mailtrap.io
            type: CNAME
            value: rwmt2.dkim.smtp.mailtrap.live
            status: pass
            name: rwmt2._domainkey
          - key: dmarc
            domain: _dmarc.mailtrap.io
            type: TXT
            value: 'v=DMARC1; p=none; rua=mailto:dmarc@smtp.mailtrap.live; ruf=mailto:dmarc@smtp.mailtrap.live; rf=afrf; pct=100'
            status: pass
            name: _dmarc
          - key: link_verification
            domain: mt-link.mailtrap.io
            type: CNAME
            value: t.mailtrap.live
            status: pass
            name: mt-link
          - key: inbound_mx
            domain: mailtrap.io
            type: MX
            value: inbound-mailtrap.io
            status: pass
            name: '@'
        open_tracking_enabled: true
        click_tracking_enabled: true
        tracking_opt_out_enabled: false
        auto_unsubscribe_link_enabled: true
        custom_domain_tracking_enabled: true
        health_alerts_enabled: true
        critical_alerts_enabled: true
        alert_recipient_email: john.doe@mailtrap.io
        inbound_enabled: true
        inbound_verified: true
        permissions:
          can_read: true
          can_update: true
          can_destroy: true

    UpdateDomainRequest:
      type: object
      properties:
        open_tracking_enabled:
          type: boolean
          description: Enable open tracking for emails sent from this domain
        click_tracking_enabled:
          type: boolean
          description: Enable click tracking for links in emails sent from this domain
        tracking_opt_out_enabled:
          type: boolean
          description: |
            Enable the tracking opt-out link in tracked emails sent from this domain.
            Requires open or click tracking to be enabled.
        auto_unsubscribe_link_enabled:
          type: boolean
          description: Automatically add an unsubscribe link to emails sent from this domain
        inbound_enabled:
