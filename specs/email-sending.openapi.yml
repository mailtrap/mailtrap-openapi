          format: date-time
          example: '2025-01-15T10:30:00Z'
        domain_name:
          type: string
          description: Sending domain this tracking opt-out applies to
          example: example.com

    Webhook:
      type: object
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          format: uri
          example: 'https://example.com/mailtrap/webhooks'
        active:
          type: boolean
          example: true
        webhook_type:
          type: string
          enum:
            - email_sending
            - campaigns
            - audit_log
            - inbound_receiving
          example: email_sending
        payload_format:
          type: string
          enum:
            - json
            - jsonlines
          example: json
        sending_stream:
          type:
            - string
            - 'null'
          enum:
            - transactional
            - bulk
            - null
          description: |
            Sending stream the webhook is subscribed to. Applicable only for
            `email_sending` webhooks.
          example: transactional
        domain_id:
          type:
            - integer
            - 'null'
          description: |
            Scopes the webhook to a specific domain ID, or all domains if
            omitted. Applicable only for `email_sending` and `campaigns`
            webhooks.
