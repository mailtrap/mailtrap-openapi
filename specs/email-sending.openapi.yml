  /api/webhooks:
    post:
      operationId: createWebhook
      summary: Create a webhook
      description: |
        Create a new webhook for the account. The response includes a
        `signing_secret` that is used to [verify webhook signatures](https://docs.mailtrap.io/email-api-smtp/advanced/webhooks#webhook-signature-verification).
      tags:
        - webhooks
      x-codeSamples:
        - lang: shell
          label: 'cURL'
          source: |
            curl -X POST https://mailtrap.io/api/webhooks \
              -H 'Authorization: Bearer YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '{
                "webhook": {
                  "url": "https://example.com/mailtrap/webhooks",
                  "webhook_type": "email_sending",
                  "payload_format": "json",
                  "sending_stream": "transactional",
                  "event_types": ["delivery", "bounce"],
                  "domain_id": 435
                }
              }'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const accountId = 1000001;
            const client = new MailtrapClient({ token: "YOUR_API_KEY", accountId });

            // The signing secret is returned only on creation — store it securely.
            const webhook = await client.webhooks.create({
              url: "https://example.com/mailtrap/webhooks",
              webhook_type: "email_sending",
              payload_format: "json",
              sending_stream: "transactional",
              event_types: ["delivery", "bounce"],
            });
            console.log(webhook);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\DTO\Request\Webhook\CreateWebhook;
            use Mailtrap\DTO\Request\Webhook\Webhook;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapSendingClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $accountId = $_ENV['MAILTRAP_ACCOUNT_ID'];
            $webhooks = (new MailtrapSendingClient($config))->webhooks($accountId);

            $response = $webhooks->createWebhook(new CreateWebhook(
                url: 'https://example.com/mailtrap/webhooks',
                webhookType: Webhook::TYPE_EMAIL_SENDING,
                eventTypes: [Webhook::EVENT_DELIVERY, Webhook::EVENT_BOUNCE],
                payloadFormat: Webhook::PAYLOAD_FORMAT_JSON,
                sendingStream: Webhook::SENDING_STREAM_TRANSACTIONAL,
            ));
            var_dump(ResponseHelper::toArray($response));
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY", account_id=1000001)

            # The signing_secret is returned only on creation — store it securely.
            webhook = client.webhooks_api.webhooks.create(
                mt.CreateWebhookParams(
                    url="https://example.com/mailtrap/webhooks",
                    webhook_type="email_sending",
                    sending_stream="transactional",
                    event_types=["delivery", "bounce"],
                )
            )
            print(webhook)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            account_id = 1000001
            webhooks = Mailtrap::WebhooksAPI.new(account_id, client)

            # The signing_secret is returned only on creation — store it securely.
            webhook = webhooks.create(
              url: 'https://example.com/mailtrap/webhooks',
              webhook_type: 'email_sending',
              payload_format: 'json',
              sending_stream: 'transactional',
              event_types: %w[delivery bounce]
            )
            puts webhook
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;
            using Mailtrap.Core.Models;
            using Mailtrap.Webhooks.Models;
            using Mailtrap.Webhooks.Requests;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var accountId = 1000001;
            var request = new CreateWebhookRequest
            {
                Url = new Uri("https://example.com/mailtrap/webhooks"),
                WebhookType = WebhookType.EmailSending,
                Active = true,
                PayloadFormat = WebhookPayloadFormat.Json,
                SendingStream = SendingStream.Transactional,
            };
            request.EventTypes.Add(WebhookEventType.Delivery);
            request.EventTypes.Add(WebhookEventType.Bounce);

            // The signing secret is returned only on creation — store it securely.
            var webhook = await client.Account(accountId).Webhooks().Create(request);
            Console.WriteLine(webhook.SigningSecret);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;
            import io.mailtrap.model.SendingStream;
            import io.mailtrap.model.WebhookEventType;
            import io.mailtrap.model.WebhookPayloadFormat;
            import io.mailtrap.model.WebhookType;
            import io.mailtrap.model.request.webhooks.CreateWebhookRequest;
            import io.mailtrap.model.request.webhooks.WebhookInput;
            import java.util.List;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            long accountId = 1000001L;
            var request = new CreateWebhookRequest(
                WebhookInput.builder()
                    .url("https://example.com/mailtrap/webhooks")
                    .webhookType(WebhookType.EMAIL_SENDING)
                    .payloadFormat(WebhookPayloadFormat.JSON)
                    .sendingStream(SendingStream.TRANSACTIONAL)
                    .eventTypes(List.of(WebhookEventType.DELIVERY, WebhookEventType.BOUNCE))
                    .build());

            // signing_secret is returned only on creation — store it securely.
            var webhook = client.generalApi().webhooks().createWebhook(accountId, request);
            System.out.println(webhook);
        - lang: go
          label: Go
          source: |
            package main

            import (
            	"context"
            	"fmt"
            	"log"
            	"os"

            	"github.com/mailtrap/mailtrap-go"
            )

            func main() {
            	client, err := mailtrap.NewClient(os.Getenv("MAILTRAP_API_TOKEN"))
            	if err != nil {
            		log.Fatal(err)
            	}

            	// The API requires sending_stream for email_sending webhooks.
            	webhook, _, err := client.Webhooks.Create(context.Background(), &mailtrap.CreateWebhookRequest{
            		URL:           "https://example.com/mailtrap/webhook",
            		WebhookType:   mailtrap.WebhookTypeEmailSending,
            		SendingStream: mailtrap.SendingStreamTransactional,
            		PayloadFormat: mailtrap.PayloadFormatJSON,
            		DomainID:      mailtrap.Ptr(int64(1000001)),
            		EventTypes:    []string{mailtrap.WebhookEventDelivery, mailtrap.WebhookEventBounce, mailtrap.WebhookEventOpen},
            		Active:        mailtrap.Ptr(true),
            	})
            	if err != nil {
            		log.Fatal(err)
            	}

            	// The signing secret is returned only here: store it to verify payloads.
            	fmt.Printf("created webhook %d, signing secret %s\n", webhook.ID, webhook.SigningSecret)
            }
        - lang: hcl
          label: OpenTofu
          source: |
            # tofu apply creates the webhook: POST /api/webhooks
            terraform {
              required_providers {
                mailtrap = {
                  source = "mailtrap/mailtrap"
                }
              }
            }

            # The token is read from the MAILTRAP_API_TOKEN environment variable.
            provider "mailtrap" {}

            # The API requires sending_stream for email_sending webhooks.
            resource "mailtrap_webhook" "delivery" {
              url            = "https://example.com/mailtrap/webhook"
              webhook_type   = "email_sending"
              sending_stream = "transactional"
              domain_id      = 1000001
              payload_format = "json"
              event_types    = ["delivery", "bounce", "open"]
              active         = true
            }

            # signing_secret is returned only on create, and is unavailable after an import.
            output "signing_secret" {
              value     = mailtrap_webhook.delivery.signing_secret
              sensitive = true
            }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - webhook
              properties:
                webhook:
                  type: object
                  required:
                    - url
                    - webhook_type
                  properties:
                    url:
                      type: string
                      format: uri
                      description: The URL that will receive webhook payloads.
                      example: 'https://example.com/mailtrap/webhooks'
                    webhook_type:
                      type: string
                      description: |
                        The type of webhook. Determines which events the webhook can subscribe to.
                      enum:
                        - email_sending
                        - campaigns
                        - audit_log
                        - inbound_receiving
                      example: email_sending
                    active:
                      type: boolean
                      description: Whether the webhook is active. Defaults to `true`.
                      default: true
                      example: true
                    payload_format:
                      type: string
                      description: Format of the webhook payload.
                      enum:
                        - json
                        - jsonlines
                      default: json
                      example: json
                    sending_stream:
                      type: string
                      description: |
                        Sending stream the webhook subscribes to. Required for `email_sending` webhook type.
                      enum:
                        - transactional
                        - bulk
                      example: transactional
                    event_types:
                      type: array
                      description: |
                        List of event types to subscribe to. Required for `email_sending` and `campaigns` webhook types.
                      items:
                        type: string
                        enum:
                          - delivery
                          - soft_bounce
                          - bounce
                          - suspension
                          - unsubscribe
                          - open
                          - spam_complaint
                          - click
                          - reject
                      example:
                        - delivery
                        - bounce
                    domain_id:
                      type: integer
                      description: |
                        Scopes the webhook to a specific domain ID, or all
                        domains if omitted. Applicable only for `email_sending`
                        and `campaigns` webhooks.
                      example: 435
                    inbound_inbox_id:
                      type: integer
                      description: |
                        ID of the inbound inbox the webhook is linked to.
                        Optional for `inbound_receiving` webhooks — omit to
                        apply the webhook to all inboxes in the account. Not
                        applicable to any other webhook type.
                      example: 1
      responses:
        '200':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreateResponse'
              example:
                data:
                  id: 1
                  url: 'https://example.com/mailtrap/webhooks'
                  active: true
                  webhook_type: email_sending
                  payload_format: json
                  sending_stream: transactional
                  domain_id: 435
                  event_types:
                    - delivery
                    - bounce
                  signing_secret: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

