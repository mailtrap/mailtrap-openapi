          type: array
          items:
            $ref: '#/components/schemas/MessageEvent'
      example:
        message_id: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        status: delivered
        subject: Welcome to our service
        from: sender@example.com
        to: recipient@example.com
        sent_at: '2025-01-15T10:30:00Z'
        client_ip: 203.0.113.42
        category: Welcome Email
        custom_variables: {}
        sending_stream: transactional
        domain_id: 3938
        template_id: 100
        template_variables: {}
        opens_count: 2
        clicks_count: 1
        raw_message_url: 'https://storage.example.com/signed/eml/a1b2c3d4-e5f6-7890-abcd-ef1234567890?token=...'
        events:
          - event_type: click
            created_at: '2025-01-15T10:35:00Z'
            details:
              click_url: 'https://example.com/track/click/abc123'
              web_ip_address: 198.51.100.50
          - event_type: spam
            created_at: '2025-01-15T10:40:00Z'
            details:
              spam_feedback_type: abuse

    MessageEvent:
      description: Event with type-specific details. Use event_type to determine which details schema applies.
      discriminator:
        propertyName: event_type
        mapping:
          delivery: '#/components/schemas/MessageEventDelivery'
          open: '#/components/schemas/MessageEventOpen'
          click: '#/components/schemas/MessageEventClick'
          soft_bounce: '#/components/schemas/MessageEventBounce'
          bounce: '#/components/schemas/MessageEventBounce'
          spam: '#/components/schemas/MessageEventSpam'
          unsubscribe: '#/components/schemas/MessageEventUnsubscribe'
          suspension: '#/components/schemas/MessageEventReject'
          reject: '#/components/schemas/MessageEventReject'
      oneOf:
        - $ref: '#/components/schemas/MessageEventDelivery'
        - $ref: '#/components/schemas/MessageEventOpen'
        - $ref: '#/components/schemas/MessageEventClick'
        - $ref: '#/components/schemas/MessageEventBounce'
        - $ref: '#/components/schemas/MessageEventSpam'
        - $ref: '#/components/schemas/MessageEventUnsubscribe'
        - $ref: '#/components/schemas/MessageEventReject'
      example:
        event_type: click
        created_at: '2025-01-15T10:35:00Z'
        details:
          click_url: 'https://example.com/track/click/abc123'
          web_ip_address: 198.51.100.50

    MessageEventDelivery:
      type: object
      required: [event_type, created_at, details]
      properties:
        event_type:
          type: string
          enum: [delivery]
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/EventDetailsDelivery'

    MessageEventOpen:
      type: object
      required: [event_type, created_at, details]
      properties:
        event_type:
          type: string
          enum: [open]
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/EventDetailsOpen'

    MessageEventClick:
      type: object
      required: [event_type, created_at, details]
      properties:
        event_type:
          type: string
          enum: [click]
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/EventDetailsClick'

    MessageEventBounce:
      type: object
      required: [event_type, created_at, details]
      properties:
        event_type:
          type: string
          enum: [soft_bounce, bounce]
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/EventDetailsBounce'

    MessageEventSpam:
      type: object
      required: [event_type, created_at, details]
      properties:
        event_type:
          type: string
          enum: [spam]
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/EventDetailsSpam'

    MessageEventUnsubscribe:
      type: object
      required: [event_type, created_at, details]
      properties:
        event_type:
          type: string
          enum: [unsubscribe]
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/EventDetailsUnsubscribe'

    MessageEventReject:
      type: object
      required: [event_type, created_at, details]
      properties:
        event_type:
          type: string
          enum: [suspension, reject]
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/EventDetailsReject'

    EventDetailsDelivery:
      type: object
      description: For event_type = delivery
      additionalProperties: false
      properties:
        sending_ip:
          type: string
          nullable: true
        recipient_mx:
          type: string
          nullable: true
        email_service_provider:
          type: string
          nullable: true
      example:
        sending_ip: 192.0.2.1
        recipient_mx: gmail-smtp-in.l.google.com
        email_service_provider: Google

    EventDetailsOpen:
      type: object
      description: For event_type = open
      additionalProperties: false
      properties:
        web_ip_address:
          type: string
          nullable: true
      example:
        web_ip_address: 198.51.100.50

    EventDetailsClick:
      type: object
      description: For event_type = click
      additionalProperties: false
      properties:
        click_url:
          type: string
          nullable: true
        web_ip_address:
          type: string
          nullable: true
      example:
        click_url: 'https://example.com/track/click/abc123'
        web_ip_address: 198.51.100.50

    EventDetailsBounce:
      type: object
      description: For event_type = soft_bounce or bounce
      additionalProperties: false
      properties:
        sending_ip:
          type: string
          nullable: true
        recipient_mx:
          type: string
          nullable: true
        email_service_provider:
          type: string
          nullable: true
        email_service_provider_status:
          type: string
          nullable: true
        email_service_provider_response:
          type: string
          nullable: true
        bounce_category:
          type: string
          nullable: true
      example:
        sending_ip: 192.0.2.1
        recipient_mx: mx.example.com
        email_service_provider: Google
        email_service_provider_status: 5.7.1
        email_service_provider_response: User unknown
        bounce_category: invalid_recipient

    EventDetailsSpam:
      type: object
      description: For event_type = spam
      additionalProperties: false
      properties:
        spam_feedback_type:
          type: string
          nullable: true
      example:
        spam_feedback_type: abuse

    EventDetailsUnsubscribe:
      type: object
      description: For event_type = unsubscribe
      additionalProperties: false
      properties:
        web_ip_address:
          type: string
          nullable: true
      example:
        web_ip_address: 198.51.100.50

    EventDetailsReject:
      type: object
      description: For event_type = suspension or reject
      additionalProperties: false
      properties:
        reject_reason:
          type: string
          nullable: true
      example:
        reject_reason: Policy rejection

    EmailLogsListFilters:
      type: object
      description: |
        Key-value map of filter name to filter spec. Each spec has operator and optional value.
        Date range uses sent_after / sent_before at top level of filters (see below).
        In query params, array values use bracket notation: `filters[field][value][]=a&filters[field][value][]=b`.
      properties:
        sent_after:
          type: string
          format: date-time
          description: Start of sent-at range (ISO 8601). Must be before or equal to sent_before.
          example: '2025-01-01T00:00:00Z'
        sent_before:
          type: string
          format: date-time
          description: End of sent-at range (ISO 8601). Must be after or equal to sent_after.
          example: '2025-01-31T23:59:59Z'
        to:
          $ref: '#/components/schemas/FilterTo'
        from:
          $ref: '#/components/schemas/FilterFrom'
        subject:
          $ref: '#/components/schemas/FilterSubject'
        status:
          $ref: '#/components/schemas/FilterStatus'
        events:
          $ref: '#/components/schemas/FilterEvents'
        clicks_count:
          $ref: '#/components/schemas/FilterClicksCount'
        opens_count:
          $ref: '#/components/schemas/FilterOpensCount'
        client_ip:
          $ref: '#/components/schemas/FilterClientIp'
        sending_ip:
          $ref: '#/components/schemas/FilterSendingIp'
        email_service_provider_response:
          $ref: '#/components/schemas/FilterEmailServiceProviderResponse'
        email_service_provider:
          $ref: '#/components/schemas/FilterEmailServiceProvider'
        recipient_mx:
          $ref: '#/components/schemas/FilterRecipientMx'
        category:
          $ref: '#/components/schemas/FilterCategory'
        domain_id:
          $ref: '#/components/schemas/FilterDomainId'
        sending_stream:
          $ref: '#/components/schemas/FilterSendingStream'

    FilterCiEqualString:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [ci_equal, ci_not_equal]
          description: "ci_* = case-insensitive"
        value:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    FilterCiContainString:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [ci_contain, ci_not_contain]
          description: "ci_* = case-insensitive"
        value:
          type: string

    FilterEqualString:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [equal, not_equal]
        value:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    FilterContainString:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [contain, not_contain]
        value:
          type: string

    FilterEmptyString:
      type: object
      required: [operator]
      properties:
        operator:
          type: string
          enum: [empty, not_empty]

    FilterTo:
      oneOf:
        - $ref: '#/components/schemas/FilterCiEqualString'
        - $ref: '#/components/schemas/FilterCiContainString'
      discriminator:
        propertyName: operator
        mapping:
          ci_equal: '#/components/schemas/FilterCiEqualString'
          ci_not_equal: '#/components/schemas/FilterCiEqualString'
          ci_contain: '#/components/schemas/FilterCiContainString'
          ci_not_contain: '#/components/schemas/FilterCiContainString'
      example:
        operator: ci_equal
        value: recipient@example.com

    FilterFrom:
      oneOf:
        - $ref: '#/components/schemas/FilterCiEqualString'
        - $ref: '#/components/schemas/FilterCiContainString'
      discriminator:
        propertyName: operator
        mapping:
          ci_equal: '#/components/schemas/FilterCiEqualString'
          ci_not_equal: '#/components/schemas/FilterCiEqualString'
          ci_contain: '#/components/schemas/FilterCiContainString'
          ci_not_contain: '#/components/schemas/FilterCiContainString'
      example:
        operator: ci_contain
        value: noreply@example.com

    FilterSubject:
      oneOf:
        - $ref: '#/components/schemas/FilterCiEqualString'
        - $ref: '#/components/schemas/FilterCiContainString'
        - $ref: '#/components/schemas/FilterEmptyString'
      discriminator:
        propertyName: operator
        mapping:
          ci_equal: '#/components/schemas/FilterCiEqualString'
          ci_not_equal: '#/components/schemas/FilterCiEqualString'
          ci_contain: '#/components/schemas/FilterCiContainString'
          ci_not_contain: '#/components/schemas/FilterCiContainString'
          empty: '#/components/schemas/FilterEmptyString'
          not_empty: '#/components/schemas/FilterEmptyString'
      example:
        operator: ci_contain
        value: Order confirmation

    FilterStatus:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [equal, not_equal]
        value:
          oneOf:
            - type: string
              enum: [delivered, not_delivered, enqueued, opted_out]
            - type: array
              items:
                type: string
                enum: [delivered, not_delivered, enqueued, opted_out]

    FilterEvents:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [include_event, not_include_event]
        value:
          oneOf:
            - type: string
              enum: [delivery, open, click, bounce, spam, unsubscribe, soft_bounce, reject, suspension]
            - type: array
              items:
                type: string
                enum: [delivery, open, click, bounce, spam, unsubscribe, soft_bounce, reject, suspension]

    FilterClicksCount:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [equal, greater_than, less_than]
        value:
          type: integer
      example:
        operator: greater_than
        value: 0

    FilterOpensCount:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [equal, greater_than, less_than]
        value:
          type: integer
      example:
        operator: equal
        value: 1

    FilterClientIp:
      oneOf:
        - $ref: '#/components/schemas/FilterEqualString'
        - $ref: '#/components/schemas/FilterContainString'
      discriminator:
        propertyName: operator
        mapping:
          equal: '#/components/schemas/FilterEqualString'
          not_equal: '#/components/schemas/FilterEqualString'
          contain: '#/components/schemas/FilterContainString'
          not_contain: '#/components/schemas/FilterContainString'
      example:
        operator: equal
        value: 203.0.113.42

    FilterSendingIp:
      oneOf:
        - $ref: '#/components/schemas/FilterEqualString'
        - $ref: '#/components/schemas/FilterContainString'
      discriminator:
        propertyName: operator
        mapping:
          equal: '#/components/schemas/FilterEqualString'
          not_equal: '#/components/schemas/FilterEqualString'
          contain: '#/components/schemas/FilterContainString'
          not_contain: '#/components/schemas/FilterContainString'
      example:
        operator: contain
        value: 192.0.2

    FilterEmailServiceProviderResponse:
      oneOf:
        - $ref: '#/components/schemas/FilterCiEqualString'
        - $ref: '#/components/schemas/FilterCiContainString'
      discriminator:
        propertyName: operator
        mapping:
          ci_equal: '#/components/schemas/FilterCiEqualString'
          ci_not_equal: '#/components/schemas/FilterCiEqualString'
          ci_contain: '#/components/schemas/FilterCiContainString'
          ci_not_contain: '#/components/schemas/FilterCiContainString'
      example:
        operator: ci_contain
        value: User unknown

    FilterEmailServiceProvider:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [equal, not_equal]
        value:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      example:
        operator: equal
        value: Google

    FilterRecipientMx:
      oneOf:
        - $ref: '#/components/schemas/FilterCiEqualString'
        - $ref: '#/components/schemas/FilterCiContainString'
      discriminator:
        propertyName: operator
        mapping:
          ci_equal: '#/components/schemas/FilterCiEqualString'
          ci_not_equal: '#/components/schemas/FilterCiEqualString'
          ci_contain: '#/components/schemas/FilterCiContainString'
          ci_not_contain: '#/components/schemas/FilterCiContainString'
      example:
        operator: ci_equal
        value: gmail-smtp-in.l.google.com

    FilterCategory:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [equal, not_equal]
        value:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      example:
        operator: equal
        value: Welcome Email

    FilterDomainId:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [equal, not_equal]
        value:
          oneOf:
            - type: integer
            - type: array
              items:
                type: integer
      example:
        operator: equal
        value: 3938

    FilterSendingStream:
      type: object
      required: [operator, value]
      properties:
        operator:
          type: string
          enum: [equal, not_equal]
        value:
          oneOf:
            - type: string
              enum: [transactional, bulk]
            - type: array
              items:
                type: string
                enum: [transactional, bulk]
      example:
        operator: equal
        value: transactional

    UnauthenticatedResponse:
      title: UnauthenticatedResponse
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: Incorrect API token
      example:
        error: Incorrect API token

    PermissionsDeniedResponse:
      title: PermissionsDeniedResponse
      type: object
      properties:
        errors:
          type: string
          description: Error message
          example: Account access forbidden
      example:
        errors: Account access forbidden

    NotFoundResponse:
      title: NotFoundResponse
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: Not Found
      example:
        error: Not Found

  responses:
    Unauthorized:
      description: Returns unauthorized error message. Check your credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedResponse'
          example:
            error: Incorrect API token

    Forbidden:
      description: Returns forbidden error message. Check your permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PermissionsDeniedResponse'
          example:
            errors: Account access forbidden

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundResponse'
          example:
            error: Not Found

    UnprocessableEntity:
      description: Validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
          example:
            errors:
              email:
                - can't be blank
              domain:
                - can't be blank
              sending_stream:
                - 'is invalid. Allowed values: transactional, bulk.'
              base:
                - "Validation failed: Domain name can't be blank, Tracking domain name is not a valid domain name"

    BAD_REQUEST:
      description: Bad request - invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
          example:
            error: Bad Request

    LIMIT_EXCEEDED:
      description: Rate limit exceeded for the current account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitExceededResponse'
          example:
            errors: Rate limit exceeded

    DomainResponse:
      description: Domain details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Domain'

    CompanyInfoResponse:
      description: Company information
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/CompanyInfo'

    DomainsResponse:
      description: List of domains
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Domain'

    GetSuppressionsResponse:
      description: List of suppressions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Suppression'

    DeleteSuppressionResponse:
      description: Suppression deleted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Suppression'

    CreateSuppressionResponse:
      description: Suppression created
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/Suppression'

    GetTrackingOptOutsResponse:
      description: List of tracking opt-outs
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingOptOut'
              last_id:
                type:
                  - string
                  - 'null'
                format: uuid
                description: |
                  Cursor for the next page. Present when the response is a full page (1000 records);
                  pass this value as the `last_id` query parameter to continue. `null` when there are no more pages.
                example: 64d71bf3-1276-417b-86e1-8e66f138acfe

    DeleteTrackingOptOutResponse:
      description: Tracking opt-out deleted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrackingOptOut'

    CreateTrackingOptOutResponse:
      description: Tracking opt-out created
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/TrackingOptOut'
