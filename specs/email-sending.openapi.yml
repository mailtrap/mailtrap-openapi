            response = client.email_logs_api.email_logs.get_list()
            print(response.total_count)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: 'YOUR_API_KEY')
            account_id = 1000001
            email_logs = Mailtrap::EmailLogsAPI.new(account_id, client)

            response = email_logs.list
            puts response.total_count
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;
            using Mailtrap.EmailLogs.Models;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var accountId = 1000001;
            var response = await client.Account(accountId).EmailLogs().List(new EmailLogsListFilter());
            Console.WriteLine(response.TotalCount);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            long accountId = 1000001L;
            var response = client.sendingApi().emailLogs().list(accountId, null, null);
            System.out.println(response.getTotalCount());
        - lang: go
          label: Go
          source: |
            package main

            import (
            	"context"
            	"fmt"
            	"log"
            	"os"

            	"github.com/mailtrap/mailtrap-go"
            )

            func main() {
            	client, err := mailtrap.NewClient(os.Getenv("MAILTRAP_API_TOKEN"))
            	if err != nil {
            		log.Fatal(err)
            	}

            	logs, _, err := client.EmailLogs.List(context.Background(), &mailtrap.EmailLogsListOptions{
            		SentAfter: "2026-01-01T00:00:00Z",
            		Filters: map[string]mailtrap.LogFilter{
            			"status": {Operator: "equal", Values: []string{mailtrap.EmailLogStatusDelivered}},
            		},
            	})
            	if err != nil {
            		log.Fatal(err)
            	}

            	for _, message := range logs.Messages {
            		fmt.Printf("%s %s -> %s (%s)\n", message.MessageID, message.From, message.To, message.Status)
            	}

            	// To walk every page instead of one, use the iterator, which follows
            	// next_page_cursor for you:
            	//
            	//	for message, err := range client.EmailLogs.All(context.Background(), nil) {
            	//		if err != nil {
            	//			log.Fatal(err)
            	//		}
            	//		fmt.Println(message.MessageID)
            	//	}
            }
      parameters:
        - name: search_after
          in: query
          description: Cursor for the next page (message_id UUID from previous response next_page_cursor).
          schema:
            type: string
            format: uuid
        - name: filters
          in: query
          description: |
            Filter criteria (deep object). Pass as `filters[field][operator]` and `filters[field][value]`.
            When a filter accepts an array value, use bracket notation: `filters[field][value][]=item1&filters[field][value][]=item2`.
            Date range: use `filters[sent_after]` and `filters[sent_before]` (ISO 8601 strings).
