  '/api/stats':
    get:
      operationId: getAccountSendingStats
      summary: Get Sending Stats
      description: Get account sending stats. Use filters to get specific stats.
      tags:
        - stats
      x-codeSamples:
        - lang: shell
          label: 'cURL'
          source: |
            curl -X GET 'https://mailtrap.io/api/stats?start_date=2025-01-01&end_date=2025-12-31' \
              -H 'Authorization: Bearer YOUR_API_KEY'
        - lang: javascript
          label: Node.js
          source: |
            import { MailtrapClient } from "mailtrap";

            const accountId = 1000001;
            const client = new MailtrapClient({ token: "YOUR_API_KEY", accountId });

            const stats = await client.stats.get({ start_date: "2026-01-01", end_date: "2026-01-31" });
            console.log(stats);
        - lang: php
          label: PHP
          source: |
            <?php
            use Mailtrap\Config;
            use Mailtrap\Helper\ResponseHelper;
            use Mailtrap\MailtrapSendingClient;

            $config = new Config($_ENV['MAILTRAP_API_KEY']);
            $accountId = (int) $_ENV['MAILTRAP_ACCOUNT_ID'];
            $stats = (new MailtrapSendingClient($config))->stats($accountId);

            $response = $stats->get('2026-01-01', '2026-01-31');
            var_dump(ResponseHelper::toArray($response));
        - lang: python
          label: Python
          source: |
            import mailtrap as mt

            client = mt.MailtrapClient(token="YOUR_API_KEY")

            account_id = 1000001
            params = mt.StatsFilterParams(start_date="2026-01-01", end_date="2026-01-31")
            stats = client.stats_api.get(account_id=account_id, params=params)
            print(stats)
        - lang: ruby
          label: Ruby
          source: |
            require 'mailtrap'

            client = Mailtrap::Client.new(api_key: ENV['MAILTRAP_API_KEY'])
            stats = Mailtrap::StatsAPI.new(YOUR_ACCOUNT_ID, client)

            puts "Stats: #{stats.get(start_date: '2026-01-01', end_date: '2026-01-31')}"
        - lang: csharp
          label: .NET
          source: |
            using Mailtrap;
            using Mailtrap.Stats.Models;

            using var mailtrapFactory = new MailtrapClientFactory("YOUR_API_KEY");
            var client = mailtrapFactory.CreateClient();

            var accountId = 1000001;
            var filter = new StatsFilter { StartDate = "2026-01-01", EndDate = "2026-01-31" };
            var stats = await client.Account(accountId).Stats().GetStats(filter);
            Console.WriteLine(stats);
        - lang: java
          label: Java
          source: |
            import io.mailtrap.api.stats.StatsFilter;
            import io.mailtrap.config.MailtrapConfig;
            import io.mailtrap.factory.MailtrapClientFactory;

            var config = new MailtrapConfig.Builder().token("YOUR_API_KEY").build();
            var client = MailtrapClientFactory.createMailtrapClient(config);

            long accountId = 1000001L;
            var filter = StatsFilter.builder().startDate("2026-01-01").endDate("2026-01-31").build();
            var stats = client.sendingApi().stats().getStats(accountId, filter);
            System.out.println(stats);
        - lang: go
          label: Go
          source: |
            package main

            import (
            	"context"
            	"fmt"
            	"log"
            	"os"

            	"github.com/mailtrap/mailtrap-go"
            )

            func main() {
            	client, err := mailtrap.NewClient(os.Getenv("MAILTRAP_API_TOKEN"))
            	if err != nil {
            		log.Fatal(err)
            	}

            	// StartDate and EndDate are required; the other fields narrow the query.
            	stats, _, err := client.Stats.Get(context.Background(), &mailtrap.StatsOptions{
            		StartDate: "2026-01-01",
            		EndDate:   "2026-01-31",
            	})
            	if err != nil {
            		log.Fatal(err)
            	}

            	fmt.Printf("delivered %d (%.2f), opened %d (%.2f)\n", stats.DeliveryCount, stats.DeliveryRate, stats.OpenCount, stats.OpenRate)
            }
      parameters:
        - $ref: '#/components/parameters/StartDateQueryFilter'
        - $ref: '#/components/parameters/EndDateQueryFilter'
        - $ref: '#/components/parameters/DomainIDsQueryFilter'
        - $ref: '#/components/parameters/SendingStreamsQueryFilter'
        - $ref: '#/components/parameters/CategoriesQueryFilter'
        - $ref: '#/components/parameters/ESPsQueryFilter'
