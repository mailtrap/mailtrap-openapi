extends: spectral:oas

rules:
  # Disable validation of examples for non-JSON media types (like jsonl)
  # because Spectral tries to parse them as JSON and fails on multi-line/concatenated JSON
  oas3-valid-media-example: off

  # Disable due to upstream regression in @stoplight/spectral-rulesets >= 1.22.3
  # (released 2026-05-21): the rule's JSONPath crashes nimma when traversing
  # past `null` values in examples ("Cannot read properties of null").
  duplicated-entry-in-enum: off

  # OpenAPI 3.1 schemas are JSON Schema 2020-12, which has no `nullable`: a schema that
  # still carries the 3.0 keyword rejects null without any warning.
  no-nullable-keyword:
    message: "`nullable` is ignored since OpenAPI 3.1: add 'null' to the type instead, e.g. type: [string, 'null']"
    severity: error
    formats: [oas3.1, oas3.2]
    # Unresolved, so a `nullable` next to a `$ref` is reported too instead of vanishing with the resolved ref.
    resolved: false
    given: $..nullable
    then:
      function: undefined
